// ===================== NẠP TÀI LIỆU → BẢNG CÂU HỎI =====================
// Cách 1 (không cần AI, chạy offline): tách câu trắc nghiệm có sẵn trong đề (Câu 1… A. B. C. D. + đáp án).
// Cách 2 (cần AI): Claude đọc tài liệu/ảnh trang sách rồi soạn câu mới, hoặc tách đề trình bày lộn xộn.
const CDN={pdf:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',pdfw:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',zip:'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'};
const MK1='⟦', MK2='⟧'; // đánh dấu chữ được gạch chân / tô màu trong file Word (thường là đáp án đúng)
let IMP=null; // {name, text, images:[], items:[], busy}

// ---------- Đọc file ----------
async function readDocx(file){
  if(!window.JSZip) await loadScript(CDN.zip);
  const zip=await JSZip.loadAsync(await file.arrayBuffer()); const xml=await zip.file('word/document.xml').async('string');
  const doc=new DOMParser().parseFromString(xml,'application/xml'); const W='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  const out=[];
  for(const p of doc.getElementsByTagNameNS(W,'p')){
    let line='';
    for(const r of p.getElementsByTagNameNS(W,'r')){
      let t=''; for(const n of r.childNodes){ if(n.localName==='t') t+=n.textContent; else if(n.localName==='tab') t+='\t'; else if(n.localName==='br') t+='\n'; }
      if(!t) continue;
      const pr=r.getElementsByTagNameNS(W,'rPr')[0]; let mark=false;
      if(pr){ const u=pr.getElementsByTagNameNS(W,'u')[0], c=pr.getElementsByTagNameNS(W,'color')[0], h=pr.getElementsByTagNameNS(W,'highlight')[0];
        if(u&&u.getAttributeNS(W,'val')!=='none') mark=true;
        if(c){ const v=(c.getAttributeNS(W,'val')||'').toLowerCase(); if(v&&v!=='auto'&&v!=='000000') mark=true; }
        if(h&&h.getAttributeNS(W,'val')!=='none') mark=true; }
      line+=mark&&t.trim()?MK1+t+MK2:t;
    }
    out.push(line.split(MK2+MK1).join(''));
  }
  return out.join('\n');
}
async function readPdf(file){
  if(!window.pdfjsLib) await loadScript(CDN.pdf);
  pdfjsLib.GlobalWorkerOptions.workerSrc=CDN.pdfw;
  const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise; const pages=[];
  for(let i=1;i<=pdf.numPages;i++){ const pg=await pdf.getPage(i); const tc=await pg.getTextContent(); let lastY=null, line='', lines=[];
    for(const it of tc.items){ const y=Math.round(it.transform[5]); if(lastY!==null&&Math.abs(y-lastY)>3){ lines.push(line); line=''; } line+=it.str+(it.hasEOL?'':''); lastY=y; if(it.hasEOL){ lines.push(line); line=''; lastY=null; } }
    if(line) lines.push(line); pages.push(lines.join('\n')); }
  return pages.join('\n');
}
async function readAnyFile(file){
  const n=file.name.toLowerCase();
  if(n.endsWith('.docx')) return {text:await readDocx(file)};
  if(n.endsWith('.pdf')) return {text:await readPdf(file)};
  if(/\.(png|jpe?g|webp|gif)$/.test(n)||file.type.startsWith('image/')) return {image:file};
  if(n.endsWith('.doc')) throw new Error('File .doc (Word cũ) chưa đọc được. Mở bằng Word và Lưu thành .docx nhé.');
  return {text:await file.text()};
}

// ---------- Tách câu có sẵn (không cần AI) ----------
const CH_KW={c0:['kĩ năng','kỹ năng','dự báo','phân loại','đo','báo cáo','thí nghiệm','đồng hồ'],c1:['nguyên tử','proton','electron','neutron','hạt nhân','nguyên tố','bảng tuần hoàn','chu kì','nhóm','amu','kí hiệu'],
 c2:['phân tử','đơn chất','hợp chất','liên kết','ion','cộng hoá trị','cộng hóa trị','hoá trị','hóa trị','công thức hoá học','công thức hóa học','khối lượng phân tử'],c3:['tốc độ','vận tốc','quãng đường','km/h','m/s','đồ thị','chuyển động'],
 c4:['âm','tần số','biên độ','tiếng vang','siêu âm','hạ âm','dao động','tiếng ồn','hz'],c5:['ánh sáng','gương','phản xạ','tia sáng','bóng tối','ảnh ảo','tia tới','pháp tuyến'],c6:['nam châm','từ trường','la bàn','cực bắc','cực nam','đường sức','nam châm điện'],
 c7:['quang hợp','hô hấp','khí khổng','diệp lục','trao đổi chất','mạch gỗ','mạch rây','thoát hơi nước','trao đổi khí','dinh dưỡng','glucose'],c8:['cảm ứng','hướng sáng','hướng nước','tập tính','hướng tiếp xúc','hướng hoá','hướng hóa'],
 c9:['sinh trưởng','phát triển','mô phân sinh','biến thái','vòng đời'],c10:['sinh sản','giao tử','thụ phấn','thụ tinh','hợp tử','nảy chồi','phân đôi','giâm','chiết','ghép','nuôi cấy mô','nhị','nhuỵ','nhụy']};
function guessCh(t){ t=t.toLowerCase(); let best='c0',bs=0; for(const [c,ks] of Object.entries(CH_KW)){ let s=0; ks.forEach(k=>{ if(t.includes(k)) s+=k.length>4?2:1; }); if(s>bs){bs=s;best=c;} } return bs?best:(IMP&&IMP.defCh)||'c1'; }
function parseKey(txt){ // bảng đáp án dạng "1-B 2.C 3:A", "1B 2C", hoặc hai dòng số / chữ
  const map={}; let m; const re=/(\d{1,3})[ \t]*[-.:)–]?[ \t]*([A-Da-d])(?![A-Za-zÀ-ỹ])/g; while((m=re.exec(txt))) map[+m[1]]=m[2].toUpperCase();
  const lines=txt.split('\n').map(l=>l.trim()).filter(Boolean);
  for(let i=0;i<lines.length-1;i++){ const nums=lines[i].match(/\d+/g), lets=lines[i+1].match(/\b[A-D]\b/g);
    if(nums&&lets&&nums.length>=2&&nums.length===lets.length&&/^[\d\s|.,;]+$/.test(lines[i])) nums.forEach((n,k)=>{ if(!map[+n]) map[+n]=lets[k]; }); }
  return map;
}
function splitOpts(s){ // "A. x  B. y  C. z  D. w" → mảng dòng
  return s.replace(/([^\n])[ \t]+(?=[*⟦]?[B-D][.)][ \t])/g,'$1\n').replace(/([^\n])[ \t]+(?=⟦[A-D][.)])/g,'$1\n');
}
function extractQuestions(raw){
  let text='\n'+raw.replace(/\r/g,'').replace(/\u00a0/g,' ').replace(/\t/g,'  ');
  text=text.replace(/⟦\s*([A-D])\s*([.)])\s*⟧/g,'*$1$2').replace(/⟦\s*([A-D])\s*⟧\s*([.)])/g,'*$1$2');
  // tách phần đáp án ở cuối (nếu có)
  let key={};
  { const re=/\n[^\S\n]*⟦?[^\S\n]*(?:bảng[^\S\n]+)?(?:đáp[^\S\n]*án|hướng[^\S\n]*dẫn[^\S\n]*chấm)[^\S\n]*⟧?[^\S\n]*[:.]?[^\S\n]*(?=\n|\d)/gi; let last=null, mm;
    while((mm=re.exec(text))) last=mm;
    if(last&&last.index>text.length*0.3){ const k=parseKey(text.slice(last.index+last[0].length).replace(/[⟦⟧*]/g,'')); if(Object.keys(k).length>=2){ key=k; text=text.slice(0,last.index); } } }
  // cắt theo "Câu N" (hoặc "N." đầu dòng)
  let parts=[]; const reC=/(?:^|\n)\s*⟦?\s*(?:câu|bài)\s*(\d{1,3})\s*⟧?\s*[:.)]?/gi; let idx=[], m;
  while((m=reC.exec(text))) idx.push({i:m.index,end:reC.lastIndex,n:+m[1]});
  if(idx.length<2){ idx=[]; const reN=/(?:^|\n)\s*(\d{1,3})\s*[.)]\s+(?=\S)/g; while((m=reN.exec(text))) idx.push({i:m.index,end:reN.lastIndex,n:+m[1]}); }
  idx.forEach((o,k)=>parts.push({n:o.n,body:text.slice(o.end,k+1<idx.length?idx[k+1].i:text.length)}));
  const items=[];
  for(const p of parts){
    const lines=splitOpts(p.body).split('\n').map(l=>l.trim()).filter(Boolean);
    let q=[], opts={}, marked={}, cur=null, inline=null, ex='';
    for(let l of lines){
      let mm;
      if((mm=l.match(/^(?:⟦)?\s*(?:đáp\s*án|chọn|đ\/a)\s*(?:đúng)?\s*[:.]?\s*(?:⟦)?\s*([A-D])\b/i))){ inline=mm[1].toUpperCase(); cur=null; continue; }
      if((mm=l.match(/^(?:giải\s*thích|lời\s*giải|hướng\s*dẫn|hd)\s*[:.]?\s*(.*)$/i))){ ex=mm[1].replace(/[⟦⟧]/g,''); cur='ex'; continue; }
      if((mm=l.match(/^([*⟦]*)\s*([A-Da-d])\s*[.)]\s*(.*)$/))&&(Object.keys(opts).length||q.length)){ const L=mm[2].toUpperCase(); let body=mm[3]; const star=mm[1].includes('*'); const mk=mm[1].includes(MK1)||(body.startsWith(MK1)&&body.endsWith(MK2))||(mm[1].includes(MK1)&&body.includes(MK2));
        if(opts[L]&&L==='A') break; opts[L]=body.replace(/[⟦⟧]/g,'').replace(/^\*+/,'').trim(); if(star||mk) marked[L]=1; cur=L; continue; }
      if(cur==='ex') ex+=' '+l.replace(/[⟦⟧]/g,'');
      else if(cur&&opts[cur]!==undefined) opts[cur]+=' '+l.replace(/[⟦⟧]/g,'');
      else q.push(l.replace(/[⟦⟧]/g,''));
    }
    const qt=q.join('\n').trim(); const L4=['A','B','C','D'];
    if(!qt||L4.some(k=>!opts[k])) continue;
    let ans=inline||key[p.n]||null; const mks=Object.keys(marked); if(!ans&&mks.length===1) ans=mks[0];
    items.push({n:p.n,q:qt,o:L4.map(k=>opts[k].trim()),ans:ans?L4.indexOf(ans):-1,ex:ex.trim(),ch:guessCh(qt+' '+qt+' '+qt+' '+L4.map(k=>opts[k]).join(' ')),lv:IMP&&IMP.defLv||1,use:true});
  }
  return items;
}

function aiAvailable(){ return !!(SAMPLE||DB.aiKey); }
let SAMPLE=null; (async()=>{ for(let i=0;i<20&&!(window.claude&&window.claude.use);i++) await new Promise(r=>setTimeout(r,250)); try{ if(window.claude&&window.claude.use){ SAMPLE=await window.claude.use('sample'); if(SAMPLE&&TAB==='myq'&&IMP) viewMyQ($('#view')); } }catch(e){} })();
function aiPrompt(mode,n,text){
  const chs=CHAPTERS.map(c=>`${c.id}: ${c.name}`).join('\n');
  const task=mode==='gen'
   ? `Dựa CHỈ vào tài liệu dưới đây, soạn ${n} câu hỏi trắc nghiệm 4 lựa chọn (1 đáp án đúng) cho học sinh lớp 7, môn Khoa học tự nhiên, theo SGK Kết nối tri thức. Trộn mức độ: khoảng 50% mức 1 (nhận biết, thông hiểu), 30% mức 2 (vận dụng, tư duy), 20% mức 3 (dạng học sinh giỏi, có tính toán hoặc suy luận nhiều bước) nếu tài liệu cho phép. Câu phải chính xác về khoa học, rõ ràng, đáp án sai phải hợp lí nhưng chắc chắn sai. Dùng tên nguyên tố, chất theo SGK mới (oxygen, hydrogen, sodium, carbon dioxide…). Không hỏi về số trang, tên sách.`
   : `Tài liệu dưới đây là một đề hoặc bài tập trắc nghiệm. Hãy TÁCH NGUYÊN VĂN các câu trắc nghiệm 4 lựa chọn có trong đó (tối đa ${n} câu), không soạn thêm câu mới, không sửa nội dung. Nếu tài liệu có đáp án thì dùng đáp án đó; nếu không có, tự giải để xác định đáp án đúng. Bỏ qua câu tự luận.`;
  return `${task}
Với mỗi câu, xếp vào một chương:
${chs}
và mức: 1, 2 hoặc 3. Viết lời giải thích ngắn (1–2 câu) bằng tiếng Việt.
Trả về DUY NHẤT một mảng JSON, không có chữ nào khác, dạng:
[{"q":"câu hỏi","correct":"đáp án đúng","wrong":["sai 1","sai 2","sai 3"],"ex":"giải thích","ch":"c3","lv":1}]
${text?`\n=== TÀI LIỆU ===\n${text}\n=== HẾT ===`:'\nTài liệu là (các) ảnh đính kèm.'}`;
}
async function blobToB64(b){ const buf=new Uint8Array(await b.arrayBuffer()); let s=''; for(let i=0;i<buf.length;i+=0x8000) s+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000)); return btoa(s); }
async function callAI(prompt,images,onText){
  if(SAMPLE){ const opts={modelTier:'default',onText}; if(images&&images.length) opts.images=images; const r=await SAMPLE(prompt,opts); return r.text; }
  if(!DB.aiKey) throw new Error('Chưa có khoá API');
  const content=[]; for(const im of images||[]) content.push({type:'image',source:{type:'base64',media_type:im.type||'image/jpeg',data:await blobToB64(im)}});
  content.push({type:'text',text:prompt});
  const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':DB.aiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:DB.aiModel||'claude-sonnet-5-5',max_tokens:8000,messages:[{role:'user',content}]})});
  const j=await res.json(); if(!res.ok) throw new Error((j.error&&j.error.message)||('Lỗi '+res.status));
  return j.content.map(c=>c.text||'').join('');
}
function parseAIJson(t){ const a=t.indexOf('['), b=t.lastIndexOf(']'); if(a<0||b<a) throw new Error('AI không trả về đúng định dạng'); const arr=JSON.parse(t.slice(a,b+1));
  return arr.filter(x=>x&&x.q&&x.correct&&Array.isArray(x.wrong)&&x.wrong.length>=3).map(x=>{ const o=shuffle([String(x.correct),...x.wrong.slice(0,3).map(String)]);
    return {q:String(x.q),o,ans:o.indexOf(String(x.correct)),ex:String(x.ex||''),ch:CHAPTERS.some(c=>c.id===x.ch)?x.ch:guessCh(x.q),lv:[1,2,3].includes(+x.lv)?+x.lv:1,use:true,ai:true}; }); }

function logAct(p,kind,detail){ if(!p) return; p.log=p.log||[]; p.log.unshift(Object.assign({t:Date.now(),k:kind},detail)); p.log=p.log.slice(0,30); }
let SYNC_T=null, SYNC_ERR=false;
function classSyncSoon(){ if(!DB.profiles.some(p=>p.cls)) return; clearTimeout(SYNC_T); SYNC_T=setTimeout(classSync,2500); }
async function classSync(){
  const ps=DB.profiles.filter(p=>p.cls); if(!ps.length) return;
  try{ await fbInit(); }catch(e){ SYNC_ERR=true; return; }
  SYNC_ERR=false;
  for(const p of ps){
    try{
      if(p.role&&p.role!=='hs'){ // giáo viên, phụ huynh, quản lý: ghi vào staff, kiểm tra có bị thu hồi quyền không
        const rv=await FB.ref(`rooms/${p.cls}/revoked/${p.id}`).get();
        if(rv.exists()){ toast(`Quyền ${ROLE_N[p.role]} của ${p.name} ở lớp ${p.cls} đã bị quản lý thu hồi`,4500); delete p.cls; delete p.role; delete p.kids; continue; }
        await FB.ref(`rooms/${p.cls}/staff/${p.id}`).set({n:p.name,e:p.emo,role:p.role,kids:p.kids||[],t:Date.now()});
      } else {
        await FB.ref(`rooms/${p.cls}/m/${p.id}`).set({n:p.name,e:p.emo,elo:p.elo,w:p.w,d:p.d,l:p.l,pr:p.pr||{},log:(p.log||[]).slice(0,15),t:Date.now()});
      }
      p.synced=Date.now();
    }catch(e){ SYNC_ERR=true; } }
  try{ localStorage.setItem(LSK,JSON.stringify(DB)); }catch(e){}
}

  const draw=()=>{ if(TAB!=='class'||CV.code!==code) return; const m=CV.data||{};
    v.innerHTML=`<div class="card"><div class="row between"><div><h2 style="margin:0">👪 Kết quả của con – lớp ${code}</h2><div class="small muted">Chỉ xem, tự cập nhật mỗi khi con luyện xong.</div></div><div class="row"><button class="btn sm" id="pk">Chọn lại con</button><button class="btn sm ghost" id="dback">← Quay lại</button></div></div></div>
     ${kids.length?kids.map(k=>m[k]?`<div class="card"><h3>${esc(m[k].e)} ${esc(m[k].n)}</h3>${memberHTML(m[k])}</div>`:`<div class="card small muted">Không tìm thấy hồ sơ ${esc(k)} (con đã rời lớp?)</div>`).join(''):'<div class="card">Chưa chọn con. Bấm "Chọn lại con".</div>'}`;
    $('#dback').onclick=()=>{ if(CV.off){CV.off();CV.off=null;} CV.code=null; CV.data=null; viewClass(v); };
    $('#pk').onclick=()=>pickKids(cp,code,()=>{ parentDash(v,code); });
  };
  if(!CV.off){ const ref=FB.ref(`rooms/${code}/m`); const h=ref.on('value',s=>{ CV.data=s.val()||{}; draw(); }); CV.off=()=>ref.off('value',h); v.innerHTML='<div class="card">⏳ Đang tải…</div>'; } else draw();
}

function classDash(v){
  const code=CV.code; const perm=classPerm(code);
  if(perm.parent) return parentDash(v,code);
  if(!perm.owner&&!perm.teacher){ CV.code=null; toast('Bạn không có quyền xem bảng lớp này'); return viewClass(v); }
  const info=(DB.adminClasses||[]).find(c=>c.code===code)||{name:'Lớp '+code};
  const draw=()=>{ if(TAB!=='class'||CV.code!==code) return; const m=CV.data||{}; if(CV.info&&CV.info.name) info.name=CV.info.name;
    let rows=Object.entries(m).map(([id,x])=>Object.assign({id},x,{s:prSum(x.pr),last:(x.log&&x.log[0]&&x.log[0].t)||0}));
    const key={t:(a,b)=>b.last-a.last,elo:(a,b)=>b.elo-a.elo,n:(a,b)=>b.s.n-a.s.n,pct:(a,b)=>b.s.pct-a.s.pct,name:(a,b)=>a.n.localeCompare(b.n)}[CV.sort];
    rows.sort(key);
    const chAgg={}; rows.forEach(r=>Object.entries(r.pr||{}).forEach(([c,x])=>{ chAgg[c]=chAgg[c]||{ok:0,n:0}; chAgg[c].ok+=x.ok; chAgg[c].n+=x.n; }));
    const today=new Date().setHours(0,0,0,0);
    v.innerHTML=`<div class="card"><div class="row between"><div><h2 style="margin:0">👩‍🏫 ${esc(info.name)} <span class="tag">${perm.owner?'⭐ Quản lý':'🧑‍🏫 Giáo viên'}</span></h2><div class="small muted">Mã lớp <b style="font-size:18px;color:var(--pri)">${code}</b> – học sinh nhập mã này ở mục Lớp học · ${rows.length} bạn · ${rows.filter(r=>r.last>=today).length} bạn luyện hôm nay · tự cập nhật</div></div>
      <div class="row"><button class="btn sm ghost" id="dback">← Quay lại</button><button class="btn sm" id="dcopy">📋 Sao chép báo cáo</button></div></div></div>
     ${perm.owner?rolesHTML(code):''}
     ${bankAdminHTML(code)}
     ${rows.length?`<div class="card"><h3>Cả lớp theo chương</h3><div class="grid g4">${CHAPTERS.concat(Object.entries(CALC_TR).map(([id,t])=>({id,short:t.name,ic:t.ic}))).map(c=>{ const x=chAgg[c.id]; const pct=x&&x.n?Math.round(x.ok/x.n*100):null;
        return `<div class="tile"><b>${c.ic} ${c.short}</b><div class="bar" style="margin:6px 0"><i style="width:${pct||0}%;background:${pct===null?'var(--line)':pct<50?'var(--bad)':pct<75?'var(--acc)':'var(--ok)'}"></i></div><div class="small" style="color:${pct===null?'var(--muted)':pct<50?'var(--bad)':pct<75?'var(--acc)':'var(--ok)'}">${pct===null?'Chưa ai luyện':`Đúng ${pct}% · ${x.n} câu`}</div></div>`; }).join('')}</div>
        <p class="small muted">Đỏ dưới 50% · cam 50–75% · xanh trên 75%. Chương đỏ là chương cả lớp cần ôn lại.</p></div>
      <div class="card"><div class="row between"><h3 style="margin:0">Từng bạn</h3><label class="small">Xếp theo <select id="dsort">${[['t','Hoạt động gần nhất'],['elo','ELO'],['n','Số câu đã làm'],['pct','% đúng'],['name','Tên']].map(([k,t])=>`<option value="${k}" ${CV.sort===k?'selected':''}>${t}</option>`).join('')}</select></label></div>
       <div style="overflow-x:auto;margin-top:8px"><table><tr><th class="l">Bạn</th><th>Lần cuối</th><th>Câu đã làm</th><th>% đúng</th><th>ELO</th><th>T/H/B</th><th class="l">Chương yếu nhất</th><th></th></tr>
       ${rows.map(r=>{ const weak=Object.entries(r.pr||{}).filter(([,x])=>x.n>=3).map(([c,x])=>[c,x.ok/x.n]).sort((a,b)=>a[1]-b[1])[0];
         return `<tr><td class="l">${esc(r.e)} <b>${esc(r.n)}</b></td><td class="small">${r.last?ago(r.last):'chưa luyện'}</td><td>${r.s.n}</td><td><b style="color:${r.s.n?(r.s.pct<50?'var(--bad)':r.s.pct<75?'var(--acc)':'var(--ok)'):'inherit'}">${r.s.n?r.s.pct+'%':'—'}</b></td><td>${r.elo}</td><td class="small">${r.w}/${r.d}/${r.l}</td><td class="l small">${weak?`${chIc(weak[0])} ${chName(weak[0])} (${Math.round(weak[1]*100)}%)`:'—'}</td><td><button class="btn sm ghost" data-det="${r.id}">Chi tiết</button></td></tr>`; }).join('')}</table></div></div>`
     :`<div class="card" style="text-align:center"><div class="big">🕐</div><p>Chưa có bạn nào vào lớp.</p><p class="small muted">Các bạn mở app → <b>👩‍🏫 Lớp học</b> → vai trò Học sinh → nhập mã <b>${code}</b> → Vào lớp.</p></div>`}`;
    bindBankAdmin(v,code);
    $('#dback').onclick=()=>{ if(CV.off){CV.off();CV.off=null;} CV.code=null; CV.data=null; viewClass(v); };
    const ds=$('#dsort'); if(ds) ds.onchange=()=>{ CV.sort=ds.value; draw(); };
    $('#dcopy').onclick=()=>copyText(`📊 ${info.name} (mã ${code}) – ${new Date().toLocaleDateString('vi-VN')}\n`+rows.map((r,i)=>`${i+1}. ${r.e} ${r.n}: ${r.s.n} câu, đúng ${r.s.pct}%, ELO ${r.elo}, ${r.last?'luyện '+ago(r.last):'chưa luyện'}`).join('\n'),'Đã sao chép báo cáo');
    $$('[data-det]',v).forEach(b=>b.onclick=()=>{ const r=m[b.dataset.det]; modal(`<h3>${esc(r.e)} ${esc(r.n)}</h3>${memberHTML(r)}<div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" onclick="this.closest('.modal').remove()">Đóng</button></div>`); });
    if(perm.owner){
      $('#rinv').onclick=()=>confirmBox('Tạo mã mời mới? Mã cũ sẽ không dùng được nữa.',async()=>{ await FB.ref(`rooms/${code}/info/inv`).set({gv:invCode(),ph:invCode()}); toast('Đã đổi mã mời'); });
      $('#rcopy').onclick=()=>{ const inv=(CV.info||{}).inv||{}; copyText(`Mời vào lớp "${info.name}" trên app KHTN·7 Đấu trường\n• Mã lớp: ${code}\n• Giáo viên dùng mã mời: ${inv.gv||'?'}\n• Phụ huynh dùng mã mời: ${inv.ph||'?'}\nCách vào: mở app → 👩‍🏫 Lớp học → chọn vai trò → nhập mã lớp và mã mời → Vào lớp.`,'Đã sao chép lời mời, dán vào Zalo gửi đi'); };
      $$('[data-rv]',v).forEach(b=>b.onclick=()=>confirmBox('Thu hồi quyền người này? Lần đồng bộ sau họ sẽ tự rời lớp.',async()=>{ await FB.ref(`rooms/${code}/revoked/${b.dataset.rv}`).set(Date.now()); await FB.ref(`rooms/${code}/staff/${b.dataset.rv}`).remove(); toast('Đã thu hồi'); }));
    }
  };
  if(!CV.off){ const ref=FB.ref(`rooms/${code}/m`); const h=ref.on('value',s=>{ CV.data=s.val()||{}; draw(); });
    const ri=FB.ref(`rooms/${code}/inbox`), hi=ri.on('value',s=>{ CV.inbox=s.val()||{}; if(CV.data) draw(); });
    const rq=FB.ref(`rooms/${code}/q`), hq=rq.on('value',s=>{ CV.qn=Object.keys(s.val()||{}).length; if(CV.data) draw(); });
    const rs=FB.ref(`rooms/${code}/staff`), hs=rs.on('value',s=>{ CV.staff=s.val()||{}; if(CV.data) draw(); });
    const rf=FB.ref(`rooms/${code}/info`), hf=rf.on('value',s=>{ CV.info=s.val()||{}; if(perm.owner&&CV.info.app&&!CV.info.inv) FB.ref(`rooms/${code}/info/inv`).set({gv:invCode(),ph:invCode()}); if(CV.data) draw(); });
    CV.off=()=>{ ref.off('value',h); ri.off('value',hi); rq.off('value',hq); rs.off('value',hs); rf.off('value',hf); CV.staff=null; CV.info=null; };
    v.innerHTML=`<div class="card">⏳ Đang tải lớp ${code}…</div>`; } else draw();
}
function pinSetDialog(p,after){
  const m=modal(`<h3>🔒 Mã PIN cho ${esc(p.emo+' '+p.name)}</h3><p class="small muted">Khi chọn hồ sơ này sẽ phải nhập PIN, để bạn khác trên cùng máy không dùng nhầm. Quên PIN thì nhờ thầy cô xoá hồ sơ và tạo lại.</p>
   <input type="text" id="pp" inputmode="numeric" maxlength="4" placeholder="4 chữ số" value="">
   <div class="row" style="justify-content:space-between;margin-top:12px">${p.pin?'<button class="btn ghost" data-off>Bỏ PIN</button>':'<span></span>'}<div class="row"><button class="btn ghost" data-x>Huỷ</button><button class="btn pri" data-y>Lưu</button></div></div>`);
  $('[data-x]',m).onclick=()=>m.remove();
  const off=$('[data-off]',m); if(off) off.onclick=()=>askPin(p,()=>{ delete p.pin; save(); m.remove(); after(); });
  $('[data-y]',m).onclick=()=>{ const v=$('#pp',m).value.trim(); if(!/^\d{4}$/.test(v)){ toast('PIN gồm 4 chữ số'); return; } const set=()=>{ p.pin=v; save(); m.remove(); toast('Đã đặt PIN'); after(); }; p.pin?askPin(p,set):set(); };
}
function askPin(p,ok){
  if(!p.pin) return ok();
  const m=modal(`<h3>${esc(p.emo+' '+p.name)}</h3><p class="small muted">Nhập mã PIN của hồ sơ</p><input type="password" id="pq" inputmode="numeric" maxlength="4"><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn ghost" data-x>Huỷ</button><button class="btn pri" data-y>Vào</button></div>`);
  const go=()=>{ if($('#pq',m).value===p.pin){ m.remove(); ok(); } else { toast('Sai PIN'); $('#pq',m).value=''; } };
  $('[data-x]',m).onclick=()=>m.remove(); $('[data-y]',m).onclick=go; $('#pq',m).onkeydown=e=>{ if(e.key==='Enter') go(); }; setTimeout(()=>$('#pq',m).focus(),50);
}

// ===================== KHO CÂU CHUNG CỦA LỚP (đồng bộ hai chiều) =====================
// rooms/<mã lớp>/q/<id>      câu đã duyệt – mọi máy trong lớp bấm "Cập nhật" là nhận về (vào Câu của tôi)
// rooms/<mã lớp>/inbox/<id>  câu thành viên gửi lên – thầy cô duyệt thì chuyển sang q
// Bản offline vẫn dùng được: chỉ lúc bấm Cập nhật / Gửi mới cần mạng.
function shareCode(){ const p=curP(); return (p&&p.cls)||(DB.profiles.find(x=>x.cls)||{}).cls||((DB.adminClasses||[])[0]||{}).code||null; }
const qClean=q=>({ch:q.ch,lv:q.lv,src:q.src||'khac',note:(q.note||'').slice(0,60),q:String(q.q).slice(0,2000),opts:q.opts.map(o=>String(o).slice(0,300)),ex:String(q.ex||'').slice(0,1000)});
async function bankPull(code,quiet){
  await fbInit(); const s=await FB.ref(`rooms/${code}/q`).get(); const bank=s.val()||{}; DB.skipSid=DB.skipSid||[];
  let add=0, upd=0, del=0;
  for(const [sid,x] of Object.entries(bank)){ if(!x||!x.q||!Array.isArray(x.opts)||x.opts.length!==4) continue; if(DB.skipSid.includes(sid)) continue;
    const cur=DB.myQ.find(q=>q.sid===sid);
    if(cur){ if(cur.q!==x.q||JSON.stringify(cur.opts)!==JSON.stringify(x.opts)||cur.ex!==x.ex){ Object.assign(cur,qClean(x)); upd++; } }
    else if(!DB.myQ.some(q=>q.q===x.q)){ DB.myQ.push(Object.assign(qClean(x),{id:uid(),sid,shared:code,from:x.from||''})); add++; } }
  const before=DB.myQ.length; DB.myQ=DB.myQ.filter(q=>!(q.shared===code&&!bank[q.sid])); del=before-DB.myQ.length;
  DB.pulled=DB.pulled||{}; DB.pulled[code]=Date.now(); save();
  if(!quiet||add||upd||del) toast(add||upd||del?`Đã cập nhật kho lớp: +${add} câu mới${upd?`, ${upd} câu được sửa`:''}${del?`, ${del} câu thầy cô đã bỏ`:''}`:'Kho câu đã mới nhất',3500);
  return {add,upd,del,total:Object.keys(bank).length};
}
async function bankPush(code,direct){ // direct = thầy cô đưa thẳng vào kho, không qua duyệt
  await fbInit(); const p=curP(); const list=DB.myQ.filter(q=>!q.shared&&!(q.sentTo||[]).includes(code));
  for(const q of list){ const id=uid(); const item=Object.assign(qClean(q),{from:p?p.emo+' '+p.name:'Thầy cô',t:Date.now()});
    await FB.ref(`rooms/${code}/${direct?'q':'inbox'}/${id}`).set(item);
    if(direct){ q.shared=code; q.sid=id; } else { q.sentTo=(q.sentTo||[]).concat(code); } }
  save(); toast(list.length?(direct?`Đã đưa ${list.length} câu vào kho lớp`:`Đã gửi ${list.length} câu, chờ thầy cô duyệt`):'Không có câu mới để gửi',3500); return list.length;
}
function bankBox(id){
  const code=shareCode(); if(!code) return `<div class="card" id="${id}"><h3>📚 Kho câu chung của lớp</h3><p class="small muted" style="margin:0">Vào một lớp ở mục 👩‍🏫 Lớp học để nhận câu hỏi thầy cô cập nhật và gửi câu của mình lên cho cả lớp.</p></div>`;
  const unsent=DB.myQ.filter(q=>!q.shared&&!(q.sentTo||[]).includes(code)).length, shared=DB.myQ.filter(q=>q.shared===code).length, t=(DB.pulled||{})[code];
  return `<div class="card" id="${id}"><h3>📚 Kho câu chung – lớp ${code}</h3><p class="small muted" style="margin:0 0 10px">Máy này có ${shared} câu từ kho lớp · cập nhật lần cuối: ${t?ago(t):'chưa'}. Cần mạng lúc bấm; ngoài ra app vẫn chạy offline.</p>
   <div class="row"><button class="btn pri" data-bpull>⬇️ Cập nhật câu hỏi mới</button><button class="btn" data-bpush ${unsent?'':'disabled'}>⬆️ Gửi ${unsent} câu của tôi lên lớp</button></div>
   <p class="small muted" style="margin:8px 0 0">${(()=>{ const cp=curP(); return (cp&&cp.cls===code&&(cp.role==='gv'||cp.role==='owner'))||(DB.adminClasses||[]).some(c=>c.code===code)?'Bạn là giáo viên / quản lý: câu gửi lên vào thẳng kho lớp, không cần duyệt.':'Câu gửi lên sẽ chờ thầy cô duyệt rồi mới đến máy các bạn khác.'; })()}</p></div>`;
}
function bindBankBox(id,after){ const r=$('#'+id); if(!r) return; const code=shareCode(); if(!code) return;
  const run=async(fn,b)=>{ b.disabled=true; try{ await fn(); }catch(e){ toast('Chưa kết nối được máy chủ. Mở file đã tải về bằng Chrome và kiểm tra mạng.',4500); } after(); };
  const cp=curP(); const direct=!!(cp&&cp.cls===code&&(cp.role==='gv'||cp.role==='owner'))||(DB.adminClasses||[]).some(c=>c.code===code);
  const a=$('[data-bpull]',r), b=$('[data-bpush]',r); if(a) a.onclick=()=>run(()=>bankPull(code),a); if(b) b.onclick=()=>run(()=>bankPush(code,direct),b); }
// Phần của thầy cô trong bảng lớp
function bankAdminHTML(code){ const inbox=Object.entries(CV.inbox||{}).sort((a,b)=>(a[1].t||0)-(b[1].t||0)); const mine=DB.myQ.filter(q=>!q.shared).length;
  return `<div class="card"><div class="row between"><h3 style="margin:0">📚 Kho câu chung của lớp (${CV.qn||0} câu)</h3><div class="row"><button class="btn sm" id="bkmine" ${mine?'':'disabled'}>⬆️ Đưa ${mine} câu của tôi vào kho</button><button class="btn sm ghost" id="bkpull">⬇️ Lấy kho về máy này</button></div></div>
   <p class="small muted">Các bạn bấm "Cập nhật câu hỏi mới" ở Câu của tôi hoặc Lớp học là nhận câu trong kho. Câu các bạn gửi lên nằm ở đây chờ duyệt.</p>
   ${inbox.length?`<div class="row between"><b>Chờ duyệt (${inbox.length})</b><button class="btn sm pri" id="bkall">Duyệt tất cả</button></div>${inbox.map(([k,x])=>`<div class="mrow"><div><div class="small muted">${esc(x.from||'')} · ${chIc(x.ch)} ${esc(chName(x.ch))} · ${esc((SRC[x.src]||x.src||''))}${x.note?' · '+esc(x.note):''}</div><div>${esc(x.q)}</div><div class="small" style="color:var(--ok)">✔ ${esc(x.opts&&x.opts[0])}</div><div class="small muted">✘ ${esc((x.opts||[]).slice(1).join(' · '))}</div></div><div class="row"><button class="btn sm pri" data-ok="${k}">Duyệt</button><button class="btn sm ghost" data-no="${k}">Bỏ</button></div></div>`).join('')}`:'<p class="small muted">Không có câu nào chờ duyệt.</p>'}</div>`; }
function bindBankAdmin(v,code){
  const approve=async k=>{ const x=CV.inbox[k]; if(!x) return; await FB.ref(`rooms/${code}/q/${k}`).set(x); await FB.ref(`rooms/${code}/inbox/${k}`).remove(); };
  $$('[data-ok]',v).forEach(b=>b.onclick=async()=>{ b.disabled=true; await approve(b.dataset.ok); });
  $$('[data-no]',v).forEach(b=>b.onclick=()=>confirmBox('Bỏ câu này?',()=>FB.ref(`rooms/${code}/inbox/${b.dataset.no}`).remove()));
  const all=$('#bkall',v); if(all) all.onclick=async()=>{ all.disabled=true; for(const k of Object.keys(CV.inbox||{})) await approve(k); toast('Đã duyệt tất cả'); };
  const mine=$('#bkmine',v); if(mine) mine.onclick=async()=>{ mine.disabled=true; await bankPush(code,true); };
  $('#bkpull',v).onclick=async()=>{ await bankPull(code); };
}

// ===================== TAB BÀI TÍNH =====================
const CF={trs:[],grs:['7'],lvs:[],tops:[]}; let CS=null;
const LVN={1:'Cơ bản',2:'Nâng cao',3:'HSG / chuyên'};
function calcTags(c){ return `<span class="tag">${CALC_TR[c.tr].ic} ${CALC_TR[c.tr].name}</span> <span class="tag ${c.g!=='7'?'l2':''}">${CALC_GR[c.g]}</span> <span class="tag ${c.lv>1?'l'+c.lv:''}">${LVN[c.lv]}</span> <span class="small muted">${esc(CTOP[c.t].name)}</span>`; }
function viewCalc(v){
  if(CS) return CS.mode==='exam'?calcExam(v):calcPrac(v);
  const p=curP(); const n=calcPick(CF).length;
  const tops=Object.entries(CTOP).filter(([,t])=>(!CF.trs.length||CF.trs.includes(t.tr))&&(!CF.grs.length||CF.grs.includes(t.g)));
  v.innerHTML=`<div class="card"><h2>🧮 Bài tính – Toán Lý · Toán Hóa · Toán Sinh</h2><p class="small muted" style="margin:0">Bài tự luận có tính toán: các bạn giải ra giấy, <b>nhập đáp số</b> để app chấm, rồi xem <b>lời giải từng bước</b>. Số liệu đổi mỗi lần nên luyện không bao giờ hết bài. Đủ chương trình lớp 7, thêm phần <b>mở rộng</b> lớp 8, lớp 9 và tuyển sinh 10 cho các bạn luyện nâng cao.</p></div>
  <div class="card"><label class="f">Môn</label><div class="row">${Object.entries(CALC_TR).map(([k,t])=>`<span class="tog ${CF.trs.includes(k)?'on':''}" data-ctr="${k}">${t.ic} ${t.name}</span>`).join('')}<span class="small muted">bỏ trống = trộn cả ba</span></div>
   <label class="f">Khối</label><div class="row"><span class="tog ${CF.grs.includes('7')?'on':''}" data-cgr="7">Lớp 7</span><span class="small muted">Mở rộng:</span>${['8','9','10'].map(g=>`<span class="tog ${CF.grs.includes(g)?'on':''}" data-cgr="${g}">${CALC_GR[g]}</span>`).join('')}</div>
   <label class="f">Mức</label><div class="row">${[1,2,3].map(l=>`<span class="tog ${CF.lvs.includes(l)?'on':''}" data-clv="${l}">${LVN[l]}</span>`).join('')}</div>
   <label class="f">Dạng bài (bỏ trống = tất cả)</label><div class="row">${tops.map(([id,t])=>`<span class="tog ${CF.tops.includes(id)?'on':''}" data-ctop="${id}">${CALC_TR[t.tr].ic} ${esc(t.name)}${CF.grs.length===1?'':' · '+CALC_GR[t.g]}</span>`).join('')||'<span class="small muted">Chọn môn / khối</span>'}</div>
   <div class="row" style="margin-top:14px"><span class="small muted">${n} dạng bài khớp lựa chọn</span><span style="flex:1"></span>
    <button class="btn pri" id="cprac" ${n?'':'disabled'}>✍️ Luyện 10 bài</button><button class="btn acc" id="cexam" ${n?'':'disabled'}>📝 Đề tự luận 45 phút</button><button class="btn" id="carena" ${n?'':'disabled'}>⚔️ Đấu bài tính</button></div></div>
  ${p?`<div class="card"><h3>Tiến độ của ${esc(p.emo+' '+p.name)}</h3><div class="grid g3">${Object.entries(CALC_TR).map(([k,t])=>{ const x=p.pr[k]||{ok:0,n:0}; const pct=x.n?Math.round(x.ok/x.n*100):0; return `<div class="tile"><b>${t.ic} ${t.name}</b><div class="bar" style="margin:6px 0"><i style="width:${pct}%"></i></div><div class="small muted">${x.n?`Đúng ${x.ok}/${x.n} bài (${pct}%)`:'Chưa luyện'}</div></div>`; }).join('')}</div></div>`:''}
  <div class="card"><h3>📖 Sổ công thức</h3><p class="small muted">Theo môn và khối đang chọn. Đọc lại trước khi luyện.</p>
   ${['7','8','9','10'].filter(g=>!CF.grs.length||CF.grs.includes(g)).map(g=>{ const ts=tops.filter(([,t])=>t.g===g); return ts.length?`<div class="daycard"><b>${CALC_GR[g]}${g!=='7'?' <span class="tag l2">mở rộng</span>':''}</b>${ts.map(([,t])=>`<div class="mrow"><span>${CALC_TR[t.tr].ic} <b>${esc(t.name)}</b></span><span class="small" style="text-align:right">${esc(t.f)}</span></div>`).join('')}</div>`:''; }).join('')}</div>`;
  const tg=(attr,arr,val)=>{ const i=arr.indexOf(val); if(i>=0) arr.splice(i,1); else arr.push(val); CF.tops=CF.tops.filter(t=>calcPick({trs:CF.trs,grs:CF.grs}).some(g=>g.t===t)); viewCalc(v); };
  $$('[data-ctr]',v).forEach(b=>b.onclick=()=>tg('tr',CF.trs,b.dataset.ctr));
  $$('[data-cgr]',v).forEach(b=>b.onclick=()=>tg('gr',CF.grs,b.dataset.cgr));
  $$('[data-clv]',v).forEach(b=>b.onclick=()=>tg('lv',CF.lvs,+b.dataset.clv));
  $$('[data-ctop]',v).forEach(b=>b.onclick=()=>{ const t=b.dataset.ctop; CF.tops=CF.tops.includes(t)?CF.tops.filter(x=>x!==t):[...CF.tops,t]; viewCalc(v); });
  $('#cprac').onclick=()=>{ CS={mode:'prac',list:calcDeck(CF,10),i:0,ok:0,done:false,input:''}; viewCalc(v); };
  $('#cexam').onclick=()=>{ CS={mode:'exam',list:calcDeck(CF,5),ans:Array(5).fill(''),end:Date.now()+45*60000,done:false}; viewCalc(v); };
  $('#carena').onclick=()=>{ Object.assign(ARF,{bank:'calc',trs:[...CF.trs],grs:[...CF.grs],lvs:[...CF.lvs]}); go('arena'); };
}
function stepsHTML(c){ return `<div class="ex"><b>Lời giải</b><ol style="margin:6px 0 0;padding-left:20px">${c.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><div style="margin-top:6px">Đáp số: <b>${esc(calcFmt(c,c.a))}</b></div></div>`; }
function calcPrac(v){
  const S=CS; const c=S.list[S.i];
  if(!c){ const p=curP(); if(!S.logged){ S.logged=1; logAct(p,'Bài tính',{ch:[...new Set(S.list.map(x=>CALC_TR[x.tr].name))].join(', '),r:S.ok+'/'+S.list.length+' bài đúng'}); save(); }
    v.innerHTML=`<div class="card" style="text-align:center"><div class="big">${S.ok}/${S.list.length}</div><p>bài có đáp số đúng</p><div class="row" style="justify-content:center"><button class="btn pri" id="again">Luyện tiếp 10 bài</button><button class="btn ghost" id="back">Đổi lựa chọn</button></div></div>`;
    $('#again').onclick=()=>{ CS={mode:'prac',list:calcDeck(CF,10),i:0,ok:0}; viewCalc(v); }; $('#back').onclick=()=>{ CS=null; viewCalc(v); }; return; }
  v.innerHTML=`<div class="card"><div class="row between"><span class="small muted">Bài ${S.i+1}/${S.list.length}</span><span class="chip">✅ ${S.ok}</span></div>
   <div style="margin:6px 0">${calcTags(c)}</div><div class="qbox">${esc(c.q)}</div>
   <div class="row"><label class="small"><b>Đáp số</b></label><input type="text" id="cin" inputmode="decimal" autocomplete="off" placeholder="Ví dụ: 12,5" style="flex:1;min-width:140px;width:auto" ${S.res!==undefined?'disabled':''} value="${esc(S.input||'')}"><span class="chip">${esc(c.u||'—')}</span>
    ${S.res===undefined?'<button class="btn pri" id="cchk">Kiểm tra</button><button class="btn ghost" id="csol">Xem lời giải</button>':''}</div>
   <p class="small muted" style="margin:6px 0 0">Làm tròn đến 2 chữ số thập phân nếu cần. Dùng dấu phẩy hoặc dấu chấm cho phần thập phân đều được.</p>
   ${S.res!==undefined?`<div class="ex" style="background:${S.res?'var(--ok-soft)':'var(--bad-soft)'}">${S.res?'✅ Đúng rồi!':S.res===false&&S.input?'❌ Chưa đúng.':'👀 Bạn đã xem lời giải.'}</div>${stepsHTML(c)}<div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn pri" id="cnext">Bài tiếp →</button></div>`:''}
   <div class="row" style="margin-top:10px"><button class="btn ghost sm" id="cstop">Kết thúc</button></div></div>`;
  const inp=$('#cin');
  const finish=ok=>{ S.res=ok; if(ok) S.ok++; beep(ok); addProgress(curP(),c.tr,ok,'prac',c.lv); save(); calcPrac(v); };
  if(S.res===undefined){ inp.focus(); inp.oninput=()=>S.input=inp.value;
    $('#cchk').onclick=()=>{ const r=calcCheck(c,inp.value); if(r===null){ toast('Nhập một con số nhé'); return; } finish(r); };
    $('#csol').onclick=()=>{ S.input=''; finish(false); };
    inp.onkeydown=e=>{ if(e.key==='Enter') $('#cchk').click(); }; }
  else { const nx=$('#cnext'); nx.onclick=()=>{ S.i++; delete S.res; S.input=''; calcPrac(v); }; nx.focus(); }
  $('#cstop').onclick=()=>{ S.list=S.list.slice(0,S.i+(S.res!==undefined?1:0)); S.i=S.list.length; delete S.res; calcPrac(v); };
}
function calcExam(v){
  const S=CS;
  if(S.done){ const res=S.list.map((c,i)=>calcCheck(c,S.ans[i])===true); const sc=res.filter(Boolean).length; const ten=sc*10/S.list.length;
    const p=curP(); if(!S.saved){ S.saved=1; S.list.forEach((c,i)=>addProgress(p,c.tr,res[i],'prac',c.lv)); logAct(p,'Đề tự luận',{ch:[...new Set(S.list.map(x=>CALC_TR[x.tr].name))].join(', '),r:NF(ten,1)+' điểm ('+sc+'/'+S.list.length+')'}); save(); }
    v.innerHTML=`<div class="card" style="text-align:center"><div class="muted">Điểm phần đáp số</div><div class="big">${NF(ten,1)}<span class="muted" style="font-size:20px">/10</span></div><p class="small muted">Mỗi bài ${NF(10/S.list.length,1)} điểm. Thầy cô chấm thêm phần trình bày trên giấy theo lời giải bên dưới.</p><button class="btn pri" id="enew">Làm đề khác</button></div>
    ${S.list.map((c,i)=>`<div class="card"><div class="row between"><b>Bài ${i+1}</b><span>${res[i]?'✅':'❌'} Bạn ghi: <b>${esc(S.ans[i]||'(bỏ trống)')}</b></span></div><div style="margin:6px 0">${calcTags(c)}</div><div class="qbox" style="font-size:16px">${esc(c.q)}</div>${stepsHTML(c)}</div>`).join('')}`;
    $('#enew').onclick=()=>{ CS=null; viewCalc(v); }; return; }
  v.innerHTML=`<div class="card"><div class="row between"><b id="xclk">⏱</b><button class="btn acc sm" id="xsub">Nộp bài</button></div><p class="small muted" style="margin:6px 0 0">Giải từng bài ra giấy (ghi đủ tóm tắt, công thức, thay số), rồi nhập đáp số vào ô. Hết giờ app tự nộp.</p></div>
   ${S.list.map((c,i)=>`<div class="card"><b>Bài ${i+1}</b> <span class="small muted">(${NF(10/S.list.length,1)} điểm)</span><div style="margin:6px 0">${calcTags(c)}</div><div class="qbox" style="font-size:16px">${esc(c.q)}</div>
     <div class="row"><label class="small"><b>Đáp số</b></label><input type="text" data-xi="${i}" inputmode="decimal" autocomplete="off" value="${esc(S.ans[i])}" style="flex:1;min-width:140px;width:auto"><span class="chip">${esc(c.u||'—')}</span></div></div>`).join('')}`;
  $$('[data-xi]',v).forEach(x=>x.oninput=()=>S.ans[+x.dataset.xi]=x.value);
  const submit=()=>{ clearInterval(iv); S.done=true; calcExam(v); window.scrollTo(0,0); };
  $('#xsub').onclick=()=>{ const left=S.ans.filter(a=>!String(a).trim()).length; if(left) confirmBox(`Còn ${left} bài chưa có đáp số. Nộp bài?`,submit); else submit(); };
  const tick=()=>{ const ms=S.end-Date.now(); if(ms<=0){ toast('Hết giờ! Bài đã được nộp.'); submit(); return; } const el=$('#xclk'); if(el) el.textContent=`⏱ ${Math.floor(ms/60000)}:${String(Math.floor(ms/1000)%60).padStart(2,'0')}`; };
  const iv=setInterval(tick,500); tick(); cleanup=()=>clearInterval(iv);
}

// ===================== KHỞI ĐỘNG =====================
(function(){ const h=location.hash.slice(1); if(TABS.some(t=>t[0]===h)) TAB=h;
  window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(h!==TAB&&TABS.some(t=>t[0]===h)) go(h); });
  render();
  setTimeout(()=>{ const c=shareCode(); if(c) bankPull(c,true).then(()=>{ if(TAB==='myq'&&!IMP) viewMyQ($('#view')); }).catch(()=>{}); },3000); })();

</script>
