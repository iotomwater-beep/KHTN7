<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KHTN 7 – Đấu trường Khoa học tự nhiên</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0f8a5f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>:root{
  --bg:#f3f7f4; --card:#fff; --ink:#15211b; --muted:#5f6f66; --line:#dde7e0;
  --pri:#0f8a5f; --pri-soft:#e1f4ea; --acc:#f08c00; --acc-soft:#fff2dc;
  --ok:#2f9e44; --ok-soft:#e3f6e7; --bad:#e03131; --bad-soft:#fdecec;
  --tA:#1c7ed6; --tA-soft:#e3f0fd; --tB:#e8590c; --tB-soft:#fdeee4;
  --r:16px; --sh:0 1px 2px rgba(20,50,30,.06),0 6px 24px rgba(20,50,30,.07);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1512; --card:#18201c; --ink:#e7efe9; --muted:#97a89e; --line:#28332d;
  --pri:#38c98d; --pri-soft:#1b3328; --acc:#ffa94d; --acc-soft:#3a2d1a;
  --ok:#51cf66; --ok-soft:#1d3324; --bad:#ff6b6b; --bad-soft:#3a2024;
  --tA:#4dabf7; --tA-soft:#1a2c40; --tB:#ff8c4a; --tB-soft:#3c261a; --sh:0 1px 2px rgba(0,0,0,.3);
}}
*{box-sizing:border-box}
body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:14px 14px 90px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.logo{font-weight:800;font-size:22px;letter-spacing:-.02em}
.logo span{color:var(--pri)}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
nav.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;margin-bottom:14px;overflow-x:auto}
nav.tabs button{flex:1;padding:9px 8px;border-radius:10px;font-weight:600;color:var(--muted);white-space:nowrap;font-size:14px}
nav.tabs button.on{background:var(--pri);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:13px}
h2{margin:0 0 6px;font-size:20px} h3{margin:0 0 8px;font-size:16px}
.btn{padding:9px 15px;border-radius:12px;font-weight:600;background:var(--pri-soft);color:var(--pri);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--pri);color:#fff} .btn.acc{background:var(--acc);color:#fff}
.btn.bad{background:var(--bad);color:#fff} .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:default}
select,input[type=text],input[type=number],textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 11px}
input[type=text],textarea{width:100%}
textarea{min-height:90px;resize:vertical}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:8px 0 4px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.hide{display:none!important}
.tog{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;cursor:pointer;user-select:none;background:var(--card)}
.tog.on{background:var(--pri);border-color:var(--pri);color:#fff}
.tile{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--card);text-align:left;display:block;width:100%}
.tile:hover{border-color:var(--pri)}
.tile .ic{font-size:26px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--pri);border-radius:99px;transition:width .3s}
.qbox{font-size:18px;font-weight:600;margin:6px 0 14px;white-space:pre-wrap}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;background:var(--card);font-size:16px;display:flex;gap:10px;align-items:flex-start}
.opt b.k{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--pri-soft);color:var(--pri);font-size:14px}
.opt:hover:not(:disabled){border-color:var(--pri)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.ex{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--acc-soft);font-size:15px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--pri-soft);color:var(--pri)}
.tag.l2{background:var(--acc-soft);color:var(--acc)} .tag.l3{background:var(--bad-soft);color:var(--bad)}
.tag.my{background:var(--tA-soft);color:var(--tA)}
/* đấu trường */
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-bottom:12px}
.team{border-radius:14px;padding:10px 12px;font-weight:700}
.team.A{background:var(--tA-soft);color:var(--tA)} .team.B{background:var(--tB-soft);color:var(--tB);text-align:right}
.team .pts{font-size:34px;line-height:1}
.vs{font-weight:800;color:var(--muted)}
.seat{display:inline-flex;gap:4px;align-items:center;font-size:13px;padding:2px 8px;border-radius:99px;background:var(--card);margin:2px;color:var(--ink);font-weight:600}
.seat.ok{background:var(--ok);color:#fff} .seat.x{background:var(--bad);color:#fff;text-decoration:line-through}
.timer{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:10px}
.timer>i{display:block;height:100%;background:var(--acc)}
.pads{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin-top:12px}
.pad{border-radius:14px;padding:10px;border:2px solid var(--line)}
.pad.A{border-color:var(--tA)} .pad.B{border-color:var(--tB)}
.pad .pb{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.pad .pb button{padding:12px 6px;border-radius:10px;background:var(--bg);font-weight:800;font-size:16px;border:1px solid var(--line)}
.pad.locked{opacity:.45}
.big{font-size:44px;font-weight:800}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:center}
th{color:var(--muted);font-size:12px;font-weight:700}
td.l,th.l{text-align:left}
tr.q1 td{background:var(--ok-soft)}
.code{font-size:48px;font-weight:800;letter-spacing:.12em;color:var(--pri)}
.mgrid{display:flex;flex-wrap:wrap;gap:6px}
.mgrid button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);font-weight:700;font-size:13px;background:var(--card)}
.mgrid button.done{background:var(--pri-soft);color:var(--pri)} .mgrid button.cur{outline:2px solid var(--pri)}
.mgrid button.ok{background:var(--ok);color:#fff} .mgrid button.bad{background:var(--bad);color:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:99;max-width:90vw}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal .card{max-width:520px;width:100%;max-height:90vh;overflow:auto}
.emo{font-size:22px}
.pf{display:inline-flex;gap:6px;align-items:center;padding:6px 10px;border-radius:12px;border:1px solid var(--line);cursor:pointer;background:var(--card);font-weight:600}
.pf.on{border-color:var(--pri);background:var(--pri-soft)}
.daycard{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.mrow:last-child{border-bottom:none}
.res{font-weight:800;font-size:16px;min-width:56px;text-align:center}
.champ{text-align:center;padding:20px;border-radius:16px;background:linear-gradient(135deg,var(--acc-soft),var(--pri-soft))}
@media(max-width:600px){.qbox{font-size:16px}.team .pts{font-size:28px}.code{font-size:36px}}
</style>
</head>

const BANK_RAW = [

['c0',3,'Một bạn muốn kiểm tra "nhiệt độ ảnh hưởng đến tốc độ nảy mầm của hạt đậu". Cách bố trí hợp lí nhất là:',['3 đĩa hạt giống nhau, cùng độ ẩm, đặt ở 3 nhiệt độ khác nhau','3 đĩa hạt khác loại, đặt ở cùng nhiệt độ','1 đĩa hạt, đổi nhiệt độ mỗi ngày','3 đĩa hạt giống nhau, tưới lượng nước khác nhau'],'Thí nghiệm đối chứng: chỉ nhiệt độ thay đổi, mọi điều kiện khác giống nhau.'],

['c1',1,'Nguyên tố hoá học là tập hợp những nguyên tử có cùng:',['Số proton trong hạt nhân','Số neutron','Khối lượng','Số lớp electron'],'Số proton quyết định nguyên tử thuộc nguyên tố nào.'],

['c1',1,'Đơn vị khối lượng nguyên tử là:',['amu','gam','kg','mol'],'amu (atomic mass unit), 1 amu ≈ 1,6605 × 10⁻²⁴ g.'],

['c2',1,'Đơn chất là chất được tạo nên từ:',['Một nguyên tố hoá học','Hai nguyên tố trở lên','Các phân tử khác loại','Các ion trái dấu'],'Ví dụ: O₂, Fe, N₂ là đơn chất.'],

['c2',1,'Trong phân tử H₂, hai nguyên tử H liên kết với nhau bằng:',['Liên kết cộng hoá trị (dùng chung electron)','Liên kết ion','Lực hấp dẫn','Liên kết kim loại'],'Mỗi H góp 1 electron tạo cặp electron dùng chung.'],
['c2',1,'Hoá trị của oxygen trong hầu hết hợp chất là:',['II','I','III','IV'],'O thường có hoá trị II; H có hoá trị I.'],

['c2',1,'Khi tạo liên kết, các nguyên tử có xu hướng đạt cấu hình electron bền vững giống:',['Khí hiếm','Kim loại kiềm','Halogen','Hydrogen'],'Khí hiếm có 8 e lớp ngoài cùng (He có 2) rất bền.'],
['c2',2,'Công thức hoá học đúng của hợp chất tạo bởi Al (III) và O (II) là:',['Al₂O₃','AlO','Al₃O₂','AlO₃'],'Quy tắc hoá trị: x·III = y·II → x/y = 2/3 → Al₂O₃.'],

['c2',2,'Phần trăm khối lượng của O trong CO₂ (C = 12, O = 16) xấp xỉ:',['72,7 %','27,3 %','50 %','66,7 %'],'KLPT = 44; %O = 32/44 × 100 ≈ 72,7 %.'],
['c2',2,'Chất nào sau đây được tạo nên bởi liên kết ion?',['NaCl','H₂O','CO₂','O₂'],'NaCl gồm ion Na⁺ và Cl⁻. Các chất còn lại có liên kết cộng hoá trị.'],
['c2',2,'Ở điều kiện thường, chất có liên kết ion như muối ăn thường:',['Ở thể rắn, khó nóng chảy','Ở thể khí','Ở thể lỏng, dễ bay hơi','Không tan trong nước'],'Lực hút ion rất mạnh nên hợp chất ion thường rắn, nhiệt độ nóng chảy cao.'],

['c2',3,'Hợp chất A gồm nguyên tố X liên kết với O, có công thức XO₂ và khối lượng phân tử 64 amu. X là:',['Sulfur (S = 32)','Carbon (C = 12)','Silicon (Si = 28)','Nitrogen (N = 14)'],'X + 32 = 64 → X = 32 → S, A là SO₂.'],

['c2',3,'Hợp chất của nguyên tố R (hoá trị III) với O có %R = 70 % theo khối lượng. R là:',['Fe (56)','Al (27)','Cr (52)','N (14)'],'Công thức R₂O₃: 2R/(2R+48) = 0,7 → 2R = 0,7·2R + 33,6 → 0,6R = 33,6 → R = 56 (Fe).'],
['c2',3,'Phân tử X gồm 2 nguyên tử của nguyên tố Y và 5 nguyên tử O, nặng hơn phân tử O₂ là 3,375 lần. Y là:',['Nitrogen (N = 14)','Phosphorus (P = 31)','Carbon (C = 12)','Sulfur (S = 32)'],'KLPT X = 3,375 × 32 = 108 → 2Y + 5 × 16 = 108 → Y = 14 → nitrogen, X là N₂O₅.'],
// --- Bổ sung: liên kết ion & liên kết cộng hoá trị (KNTT Bài 6) ---
['c2',1,'Ion là:',['Hạt mang điện tích, tạo thành khi nguyên tử nhường hoặc nhận electron','Nguyên tử trung hoà về điện','Hạt nhân của nguyên tử','Phân tử gồm hai nguyên tử'],'Nguyên tử nhường e → ion dương; nhận e → ion âm.'],

['c2',1,'Khi nguyên tử nhận thêm electron, nó trở thành:',['Ion âm','Ion dương','Nguyên tử khí hiếm','Hạt nhân'],'Thêm e (mang điện âm) nên hạt mang điện tích âm.'],

['c2',1,'Nguyên tử chlorine (Cl, Z = 17) nhận 1 electron tạo thành ion:',['Cl⁻','Cl⁺','Cl²⁻','Cl²⁺'],'Cl có 7 e lớp ngoài cùng, nhận 1 e → Cl⁻, có 18 e giống khí hiếm Ar.'],
['c2',1,'Nguyên tử magnesium (Mg, Z = 12) nhường 2 electron tạo thành ion:',['Mg²⁺','Mg⁺','Mg²⁻','Mg⁻'],'Mg có 2 e lớp ngoài cùng → nhường 2 e → Mg²⁺.'],
['c2',1,'Nguyên tử oxygen (O, Z = 8) nhận 2 electron tạo thành ion:',['O²⁻','O²⁺','O⁻','O⁺'],'O có 6 e lớp ngoài cùng → nhận 2 e để đủ 8 → O²⁻.'],

['c2',1,'Trong phân tử oxygen (O₂), hai nguyên tử O có bao nhiêu cặp electron dùng chung?',['2 cặp','1 cặp','3 cặp','4 cặp'],'Mỗi O có 6 e lớp ngoài, cần thêm 2 e → mỗi O góp 2 e → 2 cặp dùng chung (liên kết đôi).'],
['c2',1,'Trong phân tử nitrogen (N₂), hai nguyên tử N có bao nhiêu cặp electron dùng chung?',['3 cặp','1 cặp','2 cặp','5 cặp'],'Mỗi N có 5 e lớp ngoài, cần thêm 3 e → 3 cặp dùng chung (liên kết ba).'],

['c2',2,'Trong quá trình tạo thành magnesium oxide (MgO):',['Nguyên tử Mg nhường 2 electron cho nguyên tử O','Nguyên tử O nhường 2 electron cho Mg','Mg và O góp chung 2 cặp electron','Mg nhường 1 electron cho O'],'Mg (2 e ngoài cùng) → Mg²⁺; O (6 e ngoài cùng) nhận 2 e → O²⁻.'],
['c2',2,'Dãy nào sau đây chỉ gồm các chất có liên kết ion?',['NaCl, MgO, KCl','NaCl, H₂O, CO₂','HCl, CH₄, NH₃','O₂, N₂, Cl₂'],'Đều là hợp chất của kim loại điển hình với phi kim.'],
['c2',2,'Dãy nào sau đây chỉ gồm các chất có liên kết cộng hoá trị?',['H₂O, CO₂, CH₄','NaCl, MgO, CaO','KCl, H₂O, NH₃','MgO, CO₂, N₂'],'Các chất đều chỉ gồm phi kim liên kết với nhau.'],

['c2',2,'Trong phân tử methane (CH₄), nguyên tử C có bao nhiêu cặp electron dùng chung với các nguyên tử H?',['4 cặp','1 cặp','2 cặp','3 cặp'],'C có 4 e lớp ngoài, góp chung với 4 H → 4 cặp, C đạt 8 e.'],

['c2',2,'Trong phân tử nước (H₂O), nguyên tử O dùng chung bao nhiêu cặp electron?',['2 cặp (mỗi H một cặp)','1 cặp','3 cặp','4 cặp'],'O có 6 e lớp ngoài, cần thêm 2 → mỗi nguyên tử H góp chung 1 cặp.'],

['c6',2,'Cách nào làm nam châm điện mạnh hơn?',['Tăng số vòng dây quấn','Thay lõi sắt bằng lõi gỗ','Giảm dòng điện','Ngắt dòng điện'],'Lực từ tăng khi tăng số vòng dây hoặc tăng cường độ dòng điện.'],
['c6',2,'Ưu điểm của nam châm điện so với nam châm vĩnh cửu là:',['Có thể bật/tắt từ tính bằng cách đóng/ngắt dòng điện','Luôn có từ tính','Không cần nguồn điện','Nhẹ hơn mọi nam châm'],'Vì vậy nam châm điện dùng trong cần cẩu nâng sắt thép, chuông điện, rơ-le.'],
['c6',2,'Cực Bắc địa lí của Trái Đất nằm gần:',['Cực từ Nam của Trái Đất','Cực từ Bắc của Trái Đất','Xích đạo','Cực Nam địa lí'],'Kim la bàn (cực N) bị hút về phía Bắc địa lí → ở đó là cực từ Nam.'],
['c6',2,'Rắc mạt sắt lên tấm bìa đặt trên thanh nam châm, mạt sắt tập trung nhiều nhất ở:',['Hai đầu cực của nam châm','Chính giữa thanh nam châm','Phân bố đều','Xa nam châm nhất'],'Từ trường mạnh nhất ở hai cực.'],
['c6',3,'Có 3 thanh kim loại giống hệt nhau, chỉ 1 thanh là nam châm. Không dùng dụng cụ khác, cách nhận ra thanh nam châm là:',['Đưa đầu thanh A chạm giữa thanh B: nếu hút mạnh thì A là nam châm','Cân khối lượng ba thanh','Đun nóng từng thanh','Gõ để nghe âm thanh'],'Giữa thanh nam châm hầu như không có từ tính. Nếu đầu A hút được giữa B → A là nam châm.'],
['c6',3,'Một nam châm thẳng bị gãy làm đôi. Kết luận đúng:',['Mỗi nửa là một nam châm có đủ hai cực','Một nửa chỉ có cực Bắc, nửa kia chỉ có cực Nam','Cả hai nửa mất hết từ tính','Chỉ một nửa còn từ tính'],'Không thể tách riêng cực Bắc hay cực Nam.'],
['c6',3,'Vì sao vỏ la bàn thường làm bằng nhựa hoặc đồng, không làm bằng sắt?',['Sắt bị nhiễm từ, làm kim chỉ sai hướng','Sắt quá nặng','Sắt dẫn điện','Sắt dễ cháy'],'Vật liệu từ ở gần làm lệch kim nam châm.'],

// ===== c7 TRAO ĐỔI CHẤT =====
['c7',1,'Quang hợp ở thực vật diễn ra chủ yếu ở:',['Lá','Rễ','Thân già','Hoa'],'Lá có nhiều lục lạp chứa diệp lục, phiến lá rộng nhận nhiều ánh sáng.'],
['c7',1,'Nguyên liệu của quá trình quang hợp là:',['Nước và carbon dioxide','Oxygen và glucose','Nước và oxygen','Glucose và carbon dioxide'],'Nước + carbon dioxide —(ánh sáng, diệp lục)→ glucose + oxygen.'],
['c7',1,'Sản phẩm của quang hợp gồm:',['Glucose (chất hữu cơ) và oxygen','Carbon dioxide và nước','Chỉ có nước','Chỉ có năng lượng nhiệt'],'Oxygen thải ra môi trường, glucose dự trữ hoặc dùng cho cây.'],
['c7',1,'Trong quang hợp, năng lượng ánh sáng được chuyển hoá thành:',['Năng lượng hoá học trong chất hữu cơ','Năng lượng âm thanh','Nhiệt năng hoàn toàn','Điện năng'],'Năng lượng được tích luỹ trong các liên kết hoá học của glucose.'],
['c7',1,'Hô hấp tế bào diễn ra chủ yếu ở bào quan:',['Ti thể','Lục lạp','Nhân','Không bào'],'Ti thể là "nhà máy năng lượng" của tế bào.'],
['c7',1,'Phương trình chữ của hô hấp tế bào:',['Glucose + oxygen → carbon dioxide + nước + năng lượng','Carbon dioxide + nước → glucose + oxygen','Glucose → nước + oxygen','Oxygen + nước → glucose'],'Hô hấp phân giải chất hữu cơ, giải phóng năng lượng (ATP và nhiệt).'],
['c7',1,'Khí khổng ở lá có chức năng:',['Trao đổi khí và thoát hơi nước','Hấp thụ muối khoáng','Vận chuyển chất hữu cơ','Dự trữ tinh bột'],'CO₂ đi vào, O₂ và hơi nước đi ra qua khí khổng.'],
['c7',1,'Ở người, trao đổi khí diễn ra chủ yếu ở:',['Phế nang của phổi','Khí quản','Mũi','Dạ dày'],'O₂ từ phế nang khuếch tán vào máu, CO₂ từ máu ra phế nang.'],
['c7',1,'Nước và muối khoáng được vận chuyển từ rễ lên lá nhờ:',['Mạch gỗ','Mạch rây','Biểu bì','Khí khổng'],'Mạch gỗ dẫn nước, muối khoáng; mạch rây dẫn chất hữu cơ.'],
['c7',1,'Vai trò của nước đối với sinh vật là:',['Là thành phần cấu tạo tế bào, dung môi hoà tan và vận chuyển các chất','Chỉ để làm mát cơ thể','Chỉ để tạo màu xanh cho lá','Không cần thiết với động vật'],'Nước chiếm phần lớn khối lượng tế bào và tham gia nhiều phản ứng.'],
['c7',1,'Trao đổi chất ở sinh vật gồm:',['Lấy chất từ môi trường, biến đổi trong cơ thể và thải chất ra môi trường','Chỉ lấy thức ăn','Chỉ thải chất thải','Chỉ hít thở'],'Trao đổi chất luôn đi kèm chuyển hoá năng lượng.'],
['c7',2,'Vì sao không nên để nhiều cây xanh trong phòng ngủ đóng kín cửa vào ban đêm?',['Ban đêm cây chỉ hô hấp, lấy O₂ và thải CO₂','Ban đêm cây thải ra nhiều O₂','Cây hút hết hơi nước','Cây phát ra tiếng ồn'],'Không có ánh sáng → không quang hợp, nhưng cây vẫn hô hấp suốt ngày đêm.'],
['c7',2,'Để bảo quản hạt giống lâu, cần:',['Phơi khô và để nơi thoáng mát','Ngâm nước thường xuyên','Để nơi nóng ẩm','Bọc kín trong túi ướt'],'Giảm độ ẩm và nhiệt độ làm giảm cường độ hô hấp, hạt ít hao chất hữu cơ.'],
['c7',2,'Cây trồng trong bóng râm lâu ngày thường:',['Phát triển kém vì quang hợp yếu','Lớn nhanh hơn','Ra nhiều hoa hơn','Không bị ảnh hưởng'],'Thiếu ánh sáng → ít chất hữu cơ được tạo ra.'],
['c7',2,'Vì sao khi chạy nhanh, nhịp thở của ta tăng lên?',['Cơ thể cần nhiều O₂ cho hô hấp tế bào để tạo năng lượng','Phổi bị nóng lên','Để thải bớt nước','Để tiêu hoá thức ăn nhanh'],'Cơ hoạt động mạnh cần nhiều năng lượng → tăng hô hấp tế bào.'],
['c7',2,'Mối quan hệ giữa quang hợp và hô hấp ở cây là:',['Sản phẩm của quá trình này là nguyên liệu của quá trình kia','Hai quá trình hoàn toàn độc lập','Hô hấp chỉ xảy ra khi không có quang hợp','Quang hợp phân giải chất hữu cơ'],'Quang hợp tạo glucose và O₂ cho hô hấp; hô hấp tạo CO₂ và nước cho quang hợp.'],
['c7',2,'Thí nghiệm chứng minh quang hợp tạo tinh bột: lá được che giấy đen một phần, sau đó thử bằng iodine. Kết quả:',['Phần không bị che có màu xanh tím, phần bị che không có','Phần bị che có màu xanh tím','Cả lá đều không đổi màu','Cả lá đều xanh tím như nhau'],'Iodine làm tinh bột chuyển xanh tím; phần bị che không quang hợp nên không có tinh bột.'],
['c7',3,'Cho cành rong vào ống nghiệm đầy nước, úp ngược trong cốc nước và đặt ngoài nắng. Khí tích tụ ở đáy ống nghiệm làm que đóm còn tàn đỏ bùng cháy. Khí đó là:',['Oxygen, chứng tỏ quang hợp thải O₂','Carbon dioxide','Nitrogen','Hơi nước'],'O₂ duy trì sự cháy → que đóm bùng cháy.'],
['c7',3,'Nồng độ CO₂ trong nhà kính tăng vừa phải (khi đủ ánh sáng, nước) thì cường độ quang hợp:',['Tăng lên đến một giới hạn','Giảm ngay','Không đổi','Tăng vô hạn'],'CO₂ là nguyên liệu; vượt ngưỡng thì quang hợp không tăng nữa, quá cao còn gây hại.'],
['c7',3,'Bọc túi nilon trong suốt quanh một cành cây ngoài nắng, sau vài giờ thấy mặt trong túi có nhiều giọt nước. Thí nghiệm chứng minh:',['Lá thoát hơi nước','Lá hút nước từ không khí','Thân cây dự trữ nước','Rễ hút nước'],'Hơi nước thoát qua khí khổng ngưng tụ trên túi.'],
['c7',3,'Cắm cành hoa trắng vào cốc nước pha mực đỏ; sau một thời gian cắt ngang thân thấy phần bị nhuộm đỏ. Phần đó là:',['Mạch gỗ','Mạch rây','Vỏ ngoài','Ruột'],'Nước (kèm mực) được vận chuyển lên bằng mạch gỗ.'],
['c7',3,'Một học sinh đặt 2 bình kín: bình A có hạt đang nảy mầm, bình B có hạt đã luộc chín. Sau 1 ngày, que diêm đang cháy đưa vào bình nào sẽ tắt ngay?',['Bình A','Bình B','Cả hai không tắt','Cả hai tắt ngay như nhau'],'Hạt nảy mầm hô hấp mạnh, lấy hết O₂, thải CO₂; hạt luộc chín đã chết, không hô hấp.'],

// ===== c8 CẢM ỨNG =====
['c8',1,'Cảm ứng ở sinh vật là:',['Khả năng tiếp nhận và phản ứng lại các kích thích của môi trường','Khả năng sinh sản','Khả năng lớn lên','Khả năng trao đổi khí'],'Cảm ứng giúp sinh vật thích nghi với môi trường.'],
['c8',1,'Cây trồng cạnh cửa sổ có ngọn cong về phía ánh sáng. Đây là hiện tượng:',['Hướng sáng','Hướng nước','Hướng tiếp xúc','Hướng hoá'],'Thân, cành hướng về phía nguồn sáng.'],
['c8',1,'Rễ cây mọc dài về phía có nguồn nước. Đây là:',['Tính hướng nước','Tính hướng sáng','Tính hướng tiếp xúc','Tính hướng trọng lực âm'],'Rễ sinh trưởng hướng về nơi có nước.'],
['c8',1,'Tua cuốn của cây mướp quấn vào giàn là hiện tượng:',['Hướng tiếp xúc','Hướng sáng','Hướng hoá','Hướng nước'],'Tua cuốn phản ứng khi tiếp xúc với vật cứng.'],
['c8',1,'Tập tính bẩm sinh là:',['Tập tính sinh ra đã có, đặc trưng cho loài','Tập tính học được trong đời sống','Tập tính chỉ có ở người','Tập tính thay đổi liên tục'],'Ví dụ: nhện chăng tơ, ve sầu kêu vào mùa hè.'],
['c8',1,'Tập tính nào dưới đây là tập tính học được?',['Chó nghe tiếng gọi tên chạy đến','Nhện chăng tơ','Thú con bú mẹ','Chim di cư'],'Chó được huấn luyện mới hình thành phản ứng này.'],
['c8',2,'Khi chạm tay vào lá cây xấu hổ (trinh nữ), lá cụp lại. Ý nghĩa là:',['Tự vệ trước tác động bất lợi','Để quang hợp mạnh hơn','Để hút nước','Để thụ phấn'],'Phản ứng nhanh giúp cây tránh bị tổn thương.'],
['c8',2,'Ứng dụng tập tính của động vật trong chăn nuôi:',['Gõ kẻng mỗi lần cho cá ăn để cá tập trung khi nghe kẻng','Cho gà ăn bất kì giờ nào','Nuôi chung tất cả các loài','Tắt hết đèn chuồng gà đẻ'],'Hình thành tập tính học được, tiện cho việc chăm sóc.'],
['c8',2,'Ở nhà kính trồng hoa, người ta thắp đèn ban đêm cho hoa cúc để:',['Điều khiển thời gian ra hoa','Sưởi ấm cho cây','Đuổi côn trùng','Giảm thoát hơi nước'],'Cúc là cây ngày ngắn; thắp đèn ban đêm làm cây ra hoa muộn hơn, đúng dịp cần bán (ví dụ Tết).'],
['c8',3,'Đặt hạt đậu đang nảy mầm nằm ngang; sau vài ngày, rễ cong xuống, thân cong lên. Kết luận:',['Rễ hướng trọng lực dương, thân hướng trọng lực âm','Rễ và thân đều hướng sáng','Rễ hướng sáng, thân hướng nước','Cả hai không có tính hướng'],'Rễ mọc theo chiều trọng lực, thân mọc ngược chiều trọng lực.'],
['c8',3,'Bón phân ở vị trí xa gốc theo hình vòng tròn ở tán cây giúp rễ phát triển rộng. Điều này vận dụng:',['Tính hướng hoá của rễ','Tính hướng sáng của rễ','Tính hướng tiếp xúc','Tập tính bẩm sinh'],'Rễ mọc hướng về nơi có chất dinh dưỡng.'],
['c8',3,'Trong thí nghiệm cảm ứng, chậu cây đặt trong hộp kín chỉ có một lỗ sáng ở bên. Để chứng minh "cây hướng sáng", cần thêm chậu đối chứng:',['Đặt ở nơi ánh sáng chiếu đều mọi phía','Cũng trong hộp kín một lỗ','Không tưới nước','Đặt trong tủ lạnh'],'Đối chứng chỉ khác một yếu tố: hướng của nguồn sáng.'],

// ===== c9 SINH TRƯỞNG =====
['c9',1,'Sinh trưởng ở sinh vật là:',['Sự tăng về kích thước và khối lượng cơ thể','Sự ra hoa','Sự thay đổi hình dạng hoàn toàn','Sự hình thành giao tử'],'Sinh trưởng do tăng số lượng và kích thước tế bào.'],
['c9',1,'Phát triển ở sinh vật bao gồm:',['Sinh trưởng, phân hoá tế bào và phát sinh hình thái các cơ quan','Chỉ tăng chiều cao','Chỉ tăng khối lượng','Chỉ sinh sản'],'Phát triển là những biến đổi diễn ra trong vòng đời của sinh vật.'],
['c9',1,'Mô phân sinh đỉnh giúp cây:',['Tăng chiều dài (cao lên)','Tăng chiều ngang thân','Ra hoa','Rụng lá'],'Mô phân sinh bên giúp thân to ra (ở cây hai lá mầm).'],
['c9',1,'Vòng đời của ếch có giai đoạn nòng nọc, đây là kiểu phát triển:',['Qua biến thái','Không qua biến thái','Trực tiếp','Không có giai đoạn ấu trùng'],'Nòng nọc khác hẳn ếch trưởng thành về hình dạng, cấu tạo.'],
['c9',1,'Các nhân tố bên ngoài ảnh hưởng đến sinh trưởng và phát triển gồm:',['Nhiệt độ, ánh sáng, nước, chất dinh dưỡng','Chỉ có di truyền','Chỉ có hormone','Chỉ có tuổi'],'Các nhân tố bên trong: di truyền, hormone…'],
['c9',2,'Sự phát triển của bướm (trứng → sâu → nhộng → bướm) là kiểu:',['Biến thái hoàn toàn','Biến thái không hoàn toàn','Không qua biến thái','Trực tiếp'],'Sâu (ấu trùng) khác hẳn bướm trưởng thành.'],
['c9',2,'Châu chấu phát triển qua các lần lột xác, ấu trùng gần giống con trưởng thành. Đây là:',['Biến thái không hoàn toàn','Biến thái hoàn toàn','Không qua biến thái','Sinh sản vô tính'],'Trứng → ấu trùng (lột xác nhiều lần) → trưởng thành.'],
['c9',2,'Bấm ngọn cây đậu, cà chua nhằm:',['Kích thích cây ra nhiều cành bên, nhiều hoa quả','Làm cây cao nhanh hơn','Giảm số lá','Ngăn cây hô hấp'],'Loại bỏ mô phân sinh đỉnh → chồi bên phát triển.'],
['c9',2,'Trẻ em tắm nắng sáng sớm (ánh nắng nhẹ) có lợi vì:',['Giúp cơ thể tạo vitamin D, hỗ trợ hấp thụ calcium cho xương','Giúp cao nhanh gấp đôi','Thay thế việc ăn uống','Giúp không cần ngủ'],'Vitamin D giúp xương phát triển; tránh nắng gắt buổi trưa.'],
['c9',3,'Diệt bướm cải hiệu quả nhất nên tác động vào giai đoạn nào?',['Sâu (ấu trùng) – giai đoạn ăn lá gây hại','Bướm trưởng thành','Nhộng','Trứng đã nở'],'Sâu ăn lá mạnh nhất; diệt sâu vừa giảm hại vừa giảm thế hệ sau.'],
['c9',3,'Hai cây cùng giống: cây A đủ ánh sáng, nước, phân; cây B thiếu phân đạm. Sau 1 tháng, B thấp và lá vàng. Kết luận:',['Chất dinh dưỡng (đạm) ảnh hưởng đến sinh trưởng','Ánh sáng không cần thiết','Giống cây quyết định tất cả','Nước là yếu tố duy nhất'],'Hai cây chỉ khác phân đạm → nguyên nhân do thiếu đạm.'],
['c9',3,'Vì sao cây một lá mầm (như lúa, ngô) thường không to ra theo chiều ngang nhiều như cây gỗ?',['Không có mô phân sinh bên','Không có mô phân sinh đỉnh','Không quang hợp','Không có rễ'],'Mô phân sinh bên chỉ có ở cây hai lá mầm.'],

['c10',1,'Sinh sản vô tính là hình thức sinh sản:',['Không có sự kết hợp giữa giao tử đực và giao tử cái','Có sự kết hợp giao tử đực và cái','Chỉ có ở động vật','Luôn cần hai cá thể'],'Con sinh ra giống hệt cơ thể mẹ.'],

const fmt = x=>{const r=Math.round(x*100)/100; return String(r).replace('.',',');};
function uniq(correct, cands){ // trả về [đúng, 3 nhiễu khác nhau]
  const out=[correct]; for(const c of cands){ if(out.length>=4) break; if(!out.includes(c)) out.push(c); }
  let k=2; while(out.length<4){ const v=correct+' ('+k+')'; out.push(v); k++; } return out;
}

function groupOf(z){ if(z===2) return 'VIIIA'; const s=shells(z); const last=s[s.length-1]; return GROUPS[last-1]; }

const SUB = n=>n===1?'':String(n).split('').map(d=>'₀₁₂₃₄₅₆₇₈₉'[d]).join('');
function gcd(a,b){return b?gcd(b,a%b):a;}
function formula(m,a,x,y){ const part = (a[2] && y>1)?'('+a[0]+')'+SUB(y):a[0]+SUB(y); return m[0]+SUB(x)+part; }

// ---------- Tạo câu ----------
function calcPick(f){ // f: {trs:[], grs:[], lvs:[], tops:[]}
  const ok=CG.filter(g=>(!f.trs||!f.trs.length||f.trs.includes(g.tr))&&(!f.grs||!f.grs.length||f.grs.includes(g.g))&&(!f.lvs||!f.lvs.length||f.lvs.includes(g.lv))&&(!f.tops||!f.tops.length||f.tops.includes(g.t)));
  return ok;
}
function calcMake(g){ const o=g.make(); return Object.assign({kind:'calc',t:g.t,tr:g.tr,g:g.g,lv:g.lv},o); }
function calcDeck(f,n){ const gs=calcPick(f); if(!gs.length) return []; const out=[]; let bag=[];
  for(let i=0;i<n;i++){ if(!bag.length) bag=shuffle(gs); out.push(calcMake(bag.pop())); } return out; }
function calcFmt(c,x){ return NF(x,c.d)+(c.u?(c.u==='°'?'°':' '+c.u):''); }
function calcToMCQ(c){ // đổi bài tính thành câu trắc nghiệm 4 lựa chọn cho Đấu trường
  const right=calcFmt(c,c.a); const opts=[right];
  const cand=[...(c.w||[]),c.a*2,c.a/2,c.a*10,c.a+1,c.a*1.5].filter(x=>isFinite(x)&&x>=0);
  for(const x of cand){ if(opts.length>=4) break; const s=calcFmt(c,x); if(!opts.includes(s)) opts.push(s); }
  let k=2; while(opts.length<4){ const s=calcFmt(c,c.a+k); if(!opts.includes(s)) opts.push(s); k++; }
  return {id:'c',src:'calc',ch:c.tr,lv:c.lv,gr:c.g,q:c.q,opts,ex:c.steps.join(' ')};
}
function calcCheck(c,str){ // đọc số người dùng nhập: chấp nhận 2,5 · 2.5 · 12.000 · 1 200
  let s=String(str||'').trim().replace(/\s/g,''); if(!s) return null;
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,'');
  const x=parseFloat(s); if(!isFinite(x)) return null;
  const tol=Math.max(Math.abs(c.a)*0.01,0.5*Math.pow(10,-Math.min(c.d,2))+1e-9); return Math.abs(x-c.a)<=tol;
}

function addProgress(p,ch,ok,src,lv){ if(!p) return 0; p.pr[ch]=p.pr[ch]||{ok:0,n:0}; p.pr[ch].n++; if(ok) p.pr[ch].ok++;

  p.pp=p.pp||{}; p.pp[ch]=p.pp[ch]||{ok:0,n:0}; p.pp[ch].n++; if(ok) p.pp[ch].ok++;
  const r={1:900,2:1100,3:1300}[lv]||1000; const d=Math.round(8*((ok?1:0)-1/(1+Math.pow(10,(r-p.elo)/400)))); p.elo=Math.max(100,p.elo+d); return d; }

const SRC={sgk:'SGK KNTT',dp:'Đột phá tư duy',hsg:'Đề HSG',khac:'Khác'};
const BUILTIN=BANK_RAW.map((r,i)=>({id:'b'+i,ch:r[0],lv:r[1],q:r[2],opts:r[3],ex:r[4],src:'app'}));
function pool(f){ // f: {chs:[], lvs:[], mine:'all'|'only'|'none', srcs:[]}
  let a=[];
  if(f.mine!=='only'&&f.mine!=='class') a=a.concat(BUILTIN);
  if(f.mine!=='none') a=a.concat(DB.myQ.filter(q=>f.mine!=='class'||q.shared).map(q=>Object.assign({},q,{mine:true})));
  return a.filter(q=>(!f.chs||!f.chs.length||f.chs.includes(q.ch))&&(!f.lvs||!f.lvs.length||f.lvs.includes(q.lv))&&(!q.mine||!f.srcs||!f.srcs.length||f.srcs.includes(q.src)));
}
function prep(q){ // xáo đáp án → {.., opts, ans}
  const idx=shuffle([0,1,2,3].slice(0,q.opts.length)); return Object.assign({},q,{opts:idx.map(i=>q.opts[i]),ans:idx.indexOf(0)});
}
function makeDeck(f,n){ // trộn câu có sẵn + câu sinh tự động
  if(f.bank==='calc') return calcDeck({trs:f.trs,grs:f.grs,lvs:f.lvs},n).map(calcToMCQ).map(prep);
  const base=shuffle(pool(f)); const out=[]; let bi=0, guard=0;
  while(out.length<n && guard++<n*6){
    const useGen=f.mine!=='only' && f.mine!=='class' && Math.random()<(f.genRate??0.3);
    let q=null;
    if(useGen){ const chs=f.chs&&f.chs.length?f.chs:null; const lvs=f.lvs&&f.lvs.length?f.lvs:null; q=genQuestion(chs?pick(chs):null, lvs?pick(lvs):null); if(q) q=Object.assign({id:'g',src:'gen'},q); }
    if(!q && base.length){ q=base[bi%base.length]; bi++; if(bi>base.length*3) break; }
    if(q) out.push(prep(q));
  }
  return out;
}
function lvTag(q){ const L=LEVELS[q.lv]||LEVELS[1]; return `${q.gr?`<span class="tag ${q.gr!=='7'?'l2':''}">${CALC_GR[q.gr]}</span> `:''}<span class="tag ${q.lv>1?'l'+q.lv:''}">${q.gr?LVN[q.lv]:L.tag}</span>${q.mine?` <span class="tag my">✍ ${esc(SRC[q.src]||q.src)}${q.note?' · '+esc(q.note):''}</span>`:''}${q.src==='gen'?' <span class="tag my">🎲 số liệu mới</span>':''}`; }

}
function bindFilter(id,f,onchg){
  const r=$('#'+id); if(!r) return;
  const tgl=(arr,val,t)=>{ const i=arr.indexOf(val); if(i>=0) arr.splice(i,1); else arr.push(val); t.classList.toggle('on'); onchg&&onchg(); };
  $$('[data-bank]',r).forEach(t=>t.onclick=()=>{ f.bank=t.dataset.bank; f.lvs=[]; r.innerHTML=filterInner(f); bindFilter(id,f,onchg); onchg&&onchg(); });
  $$('[data-ch]',r).forEach(t=>t.onclick=()=>tgl(f.chs,t.dataset.ch,t));
  $$('[data-tr]',r).forEach(t=>t.onclick=()=>tgl(f.trs,t.dataset.tr,t));
  $$('[data-gr]',r).forEach(t=>t.onclick=()=>tgl(f.grs,t.dataset.gr,t));
  $$('[data-lv]',r).forEach(t=>t.onclick=()=>tgl(f.lvs,+t.dataset.lv,t));
  $$('[data-mine]',r).forEach(t=>t.onclick=()=>{ f.mine=t.dataset.mine; $$('[data-mine]',r).forEach(x=>x.classList.toggle('on',x===t)); onchg&&onchg(); });
}

  $$('[data-p]',m).forEach(d=>d.onclick=e=>{ if(e.target.dataset.del) return; const pp=DB.profiles.find(x=>x.id===d.dataset.p); m.remove(); askPin(pp,()=>{ DB.cur=pp.id; save(); render(); }); });
  $$('[data-del]',m).forEach(b=>b.onclick=()=>{ const p=DB.profiles.find(x=>x.id===b.dataset.del); confirmBox(`Xoá hồ sơ "${p.name}"?`,()=>{ DB.profiles=DB.profiles.filter(x=>x!==p); if(DB.cur===p.id) DB.cur=DB.profiles[0]?.id||null; save(); m.remove(); render(); }); });

const PRF={chs:[],lvs:[],mine:'all'}; let PS=null;
function viewPractice(v){
  if(!PS){
    v.innerHTML=`<div class="card"><h2>📚 Luyện tập</h2><p class="muted small" style="margin:0">Làm từng câu, xem ngay đáp án và lời giải. Câu tính toán (tốc độ, âm, gương, nguyên tử, công thức hoá học) được sinh số liệu mới mỗi lần.</p>
     ${filterUI('pf',PRF)}<div class="row" style="margin-top:14px"><span class="small muted" id="pcnt"></span><span style="flex:1"></span><button class="btn pri" id="pgo">Bắt đầu 10 câu</button><button class="btn" id="pgo2">20 câu</button></div></div>`;
    const cnt=()=>$('#pcnt').textContent=PRF.bank==='calc'?`${calcPick(PRF).length} dạng bài tính, số liệu mới mỗi lần`:`${pool(PRF).length} câu khớp bộ lọc`; cnt(); bindFilter('pf',PRF,cnt);
    const start=n=>{ const d=makeDeck(PRF,n); if(!d.length){toast('Không có câu nào khớp bộ lọc');return;} PS={deck:d,i:0,ok:0,picked:null}; viewPractice(v); };
    $('#pgo').onclick=()=>start(10); $('#pgo2').onclick=()=>start(20); return;
  }
  const q=PS.deck[PS.i];
  if(!q){ if(!PS.deck.length){ PS=null; return viewPractice(v); } const pct=Math.round(PS.ok/PS.deck.length*100);
    if(!PS.logged){ PS.logged=1; logAct(curP(),'Luyện tập',{ch:PRF.chs.map(chName).join(', ')||'Trộn chương',r:PS.ok+'/'+PS.deck.length+' đúng'}); save(); }
    v.innerHTML=`<div class="card" style="text-align:center"><div class="big">${PS.ok}/${PS.deck.length}</div><p>${pct>=80?'🌟 Xuất sắc!':pct>=50?'👍 Khá lắm, luyện thêm chút nữa!':'💪 Cố lên, xem lại lời giải nhé!'}</p><div class="row" style="justify-content:center"><button class="btn pri" id="again">Luyện tiếp</button><button class="btn ghost" id="back">Đổi bộ lọc</button></div></div>`;
    $('#again').onclick=()=>{ PS={deck:makeDeck(PRF,PS.deck.length),i:0,ok:0,picked:null}; viewPractice(v); }; $('#back').onclick=()=>{PS=null;viewPractice(v);}; return; }
  v.innerHTML=`<div class="card"><div class="row between"><span class="small muted">Câu ${PS.i+1}/${PS.deck.length} · ${chIc(q.ch)} ${chName(q.ch)} · ${lvTag(q)}</span><span class="chip">✅ ${PS.ok}</span></div>
   <div class="bar" style="margin:8px 0"><i style="width:${PS.i/PS.deck.length*100}%"></i></div>
   <div class="qbox">${esc(q.q)}</div><div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><b class="k">${'ABCD'[i]}</b><span>${esc(o)}</span></button>`).join('')}</div>
   <div id="pex"></div><div class="row" style="margin-top:12px;justify-content:space-between"><button class="btn ghost sm" id="pstop">Kết thúc</button><button class="btn pri hide" id="pnext">Câu tiếp →</button></div></div>
   <p class="small muted">Mẹo: bấm phím 1 2 3 4 để chọn, Enter để sang câu.</p>`;
  const choose=i=>{ if(PS.picked!==null) return; PS.picked=i; const ok=i===q.ans; if(ok) PS.ok++; beep(ok);
    const p=curP(); const de=addProgress(p,q.ch,ok,'prac',q.lv); save();
    $$('.opt',v).forEach((b,j)=>{ b.disabled=true; if(j===q.ans) b.classList.add('ok'); else if(j===i) b.classList.add('bad'); });
    $('#pex').innerHTML=`<div class="ex">${ok?'✅ Chính xác!':'❌ Chưa đúng. Đáp án: <b>'+'ABCD'[q.ans]+'</b>'}${p&&de?` <span class="chip" style="margin-left:6px">ELO ${de>0?'+':''}${de} → ${p.elo}</span>`:''}<br>${esc(q.ex||'')}</div>`; $('#pnext').classList.remove('hide'); };
  $$('.opt',v).forEach(b=>b.onclick=()=>choose(+b.dataset.i));

  $('#pstop').onclick=()=>{ PS.deck=PS.deck.slice(0,PS.i+(PS.picked!==null?1:0)); PS.i=PS.deck.length; viewPractice(v); };

    const p=curP(); if(!ES.saved){ d.forEach((q,i)=>addProgress(p,q.ch,ES.ans[i]===q.ans,'prac',q.lv)); logAct(p,'Thi thử',{ch:EXF.chs.map(chName).join(', ')||'Trộn chương',r:String(ten).replace('.',',')+' điểm ('+sc+'/'+d.length+')'}); save(); ES.saved=true; }

   <div class="row" style="justify-content:space-between;margin-top:12px"><button class="btn ghost" id="eprev" ${ES.i?'':'disabled'}>← Câu trước</button><button class="btn" id="enext" ${ES.i<d.length-1?'':'disabled'}>Câu sau →</button></div></div>`;

  $('#eprev').onclick=()=>{ES.i--;viewExam(v);}; $('#enext').onclick=()=>{ES.i++;viewExam(v);};
  const submit=()=>{ ES.done=true; viewExam(v); };
  $('#esub').onclick=()=>{ const left=ES.ans.filter(a=>a===null).length; if(left) confirmBox(`Còn ${left} câu chưa làm. Nộp bài?`,submit); else submit(); };

function importMyQ(t){ try{ const o=JSON.parse(t); const items=Array.isArray(o)?o:o.items; const ok=items.filter(q=>q&&q.q&&Array.isArray(q.opts)&&q.opts.length===4&&CHAPTERS.some(c=>c.id===q.ch)); let n=0;

  save(); toast(`Đã nhập ${n} câu mới`); return true; }catch(e){ toast('Dữ liệu không đúng định dạng'); return false; } }
function parseBulk(txt,base){
  const blocks=txt.split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean); const ok=[]; let bad=0;
  for(const b of blocks){ const lines=b.split('\n').map(l=>l.trim()).filter(Boolean); let q='',o={},ans='',ex='';
    for(const l of lines){ let m;
      if((m=l.match(/^(?:câu(?:\s*\d+)?\s*[:.]?)\s*(.*)$/i))&&!q) q=m[1];
      else if((m=l.match(/^([A-Da-d])[.)]\s*(.+)$/))) o[m[1].toUpperCase()]=m[2];
      else if((m=l.match(/^đáp\s*án\s*[:.]?\s*([A-Da-d])/i))) ans=m[1].toUpperCase();
      else if((m=l.match(/^(?:giải\s*thích|lời\s*giải|hd)\s*[:.]?\s*(.*)$/i))) ex=m[1];
      else if(!Object.keys(o).length && q) q+='\n'+l; else if(!q) q=l; }
    const keys=['A','B','C','D']; if(!q||keys.some(k=>!o[k])||!ans){bad++;continue;}
    const opts=[o[ans],...keys.filter(k=>k!==ans).map(k=>o[k])]; if(new Set(opts).size<4){bad++;continue;}
    ok.push(Object.assign({},base,{id:uid(),q,opts,ex})); }
  return {ok,bad,err:blocks.length?'Sai mẫu: cần "Câu:", 4 dòng A. B. C. D. và "Đáp án: X"':'Chưa dán nội dung'};
}
function copyText(t,msg){ const done=()=>toast(msg||'Đã sao chép'); try{ navigator.clipboard.writeText(t).then(done,()=>fallbackCopy(t,done)); }catch(e){ fallbackCopy(t,done); } }
function fallbackCopy(t,done){ const m=modal(`<h3>Sao chép thủ công</h3><p class="small muted">Bấm vào ô, Ctrl+A rồi Ctrl+C.</p><textarea style="min-height:160px">${esc(t)}</textarea><div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn" data-x>Đóng</button></div>`); $('textarea',m).select(); $('[data-x]',m).onclick=()=>m.remove(); }

// ===================== ĐẤU TRƯỜNG: BỘ MÁY TRẬN ĐẤU =====================
// Ghế: A1, A2 (đội A) – B1, B2 (đội B). Loại ghế: human (trên máy này), bot, remote (online).
const BOT_NAMES=['Bot Mầm','Bot Chồi','Bot Lá','Bot Hoa','Bot Quả','Bot Cây','Bot Rừng','Bot Đại Ngàn'];
const BOT_EMO=['🌱','🌿','🍃','🌼','🍎','🌳','🌲','🏔️'];
const KEYSETS=[['1','2','3','4'],['q','w','e','r'],['u','i','o','p'],['7','8','9','0']];
const ARENA_TIME={1:15,2:25,3:40};
function botSeat(l){ return {kind:'bot',lvl:l,name:BOT_NAMES[l-1],emo:BOT_EMO[l-1],elo:700+100*l}; }
function eloExpected(a,b){ return 1/(1+Math.pow(10,(b-a)/400)); }

class Match{
  constructor(cfg){ // cfg: {seats:{A1:{..},B1:{..},..}, target, filter, noDraw, onUpdate, onEnd}
    this.cfg=cfg; this.seats=cfg.seats; this.score={A:0,B:0}; this.qi=-1; this.q=null; this.phase='ready';
    this.cap=cfg.target*2+6; this.timers=[]; this.history=[]; this.deck=makeDeck(cfg.filter,this.cap+20); this.extra=0;
  }
  team(s){ return s[0]; }
  seatIds(){ return Object.keys(this.seats).filter(k=>this.seats[k]); }
  clearT(){ this.timers.forEach(clearTimeout); this.timers=[]; }
  start(){ this.next(); }
  next(){
    this.clearT();
    const {A,B}=this.score, t=this.cfg.target;
    const asked=this.qi+1;
    if(A>=t||B>=t||(asked>=this.cap&&!(this.cfg.noDraw&&A===B))) return this.finish();
    this.qi++; this.q=this.deck[this.qi]||prep(pick(pool({}))); if(!this.deck[this.qi]) this.deck[this.qi]=this.q;
    this.ans={}; this.winner=null; this.phase='q';
    this.limit=(ARENA_TIME[this.q.lv]||20)*1000; this.deadline=Date.now()+this.limit;
    this.sudden=asked>=this.cap;
    this.timers.push(setTimeout(()=>this.reveal(),this.limit));
    for(const s of this.seatIds()){ const st=this.seats[s]; if(st.kind!=='bot') continue;
      const acc=Math.max(.15,Math.min(.97,.35+.075*st.lvl-.08*(this.q.lv-1)));
      const t=Math.max(1500,this.limit*(.78-.07*st.lvl)*(.6+Math.random()*.6));
      const ok=Math.random()<acc; const c=ok?this.q.ans:pick([0,1,2,3].filter(x=>x!==this.q.ans));
      if(t<this.limit-300) this.timers.push(setTimeout(()=>this.answer(s,c),t)); }
    this.upd();
  }
  answer(seat,c){
    if(this.phase!=='q'||!this.seats[seat]||this.ans[seat]) return;
    const ok=c===this.q.ans; this.ans[seat]={c,ok,t:Date.now()};
    if(ok){ this.winner=seat; this.score[this.team(seat)]++; beep(true); return this.reveal(); }
    beep(false);
    // đội có tất cả thành viên đã sai thì không trả lời được nữa; nếu mọi ghế đã trả lời → lộ đáp án
    if(this.seatIds().every(s=>this.ans[s])) return this.reveal();
    this.upd();
  }
  reveal(){ if(this.phase!=='q') return; this.clearT(); this.phase='rev';
    this.history.push({q:this.q,winner:this.winner,ans:this.ans,t0:this.deadline-this.limit});
    this.upd(); this.timers.push(setTimeout(()=>this.next(),this.cfg.revealMs||3200)); }
  finish(){
    this.clearT(); this.phase='end'; const {A,B}=this.score; const res=A>B?'A':B>A?'B':'D';
    // ELO cho hồ sơ người thật
    const teamElo=t=>{ const ss=this.seatIds().filter(s=>s[0]===t); return ss.reduce((x,s)=>x+(this.seats[s].elo||1000),0)/Math.max(1,ss.length); };
    const eA=eloExpected(teamElo('A'),teamElo('B')); const sA=res==='A'?1:res==='D'?.5:0;
    this.delta={};
    for(const s of this.seatIds()){ const st=this.seats[s]; if(st.kind==='bot') continue;
      const exp=s[0]==='A'?eA:1-eA, sc=s[0]==='A'?sA:1-sA; const d=Math.round(32*(sc-exp)); this.delta[s]=d;
      if(st.pid){ const p=DB.profiles.find(x=>x.id===st.pid); if(p){ p.elo=Math.max(100,p.elo+d); if(sc===1)p.w++; else if(sc===.5)p.d++; else p.l++;
        this.history.forEach(h=>{ if(h.ans[s]) addProgress(p,h.q.ch,h.ans[s].ok,'arena'); });
        logAct(p,'Đấu '+(this.seatIds().length>2?'2 vs 2':'1 vs 1'),{r:(sc===1?'Thắng ':sc===.5?'Hoà ':'Thua ')+(s[0]==='A'?A+'–'+B:B+'–'+A)}); } } }
    save(); this.result=res; this.upd(); this.cfg.onEnd&&this.cfg.onEnd(this);
  }
  stop(){ this.clearT(); this.phase='end'; }
  upd(){ this.cfg.onUpdate&&this.cfg.onUpdate(this); }
}

// ----- Giao diện trận đấu dùng chung (chạy trên máy chủ trận)
function seatLabel(st){ return `${st.emo||'🙂'} ${esc(st.name)}`; }
function renderMatch(el,m,opts={}){
  const ids=m.seatIds(); const q=m.q;
  const teamNames=t=>ids.filter(s=>s[0]===t).map(s=>`<span class="seat ${m.ans&&m.ans[s]?(m.ans[s].ok?'ok':'x'):''}">${seatLabel(m.seats[s])}${m.seats[s].kind==='remote'?' 🌐':''}</span>`).join('');
  let body='';
  if(m.phase==='end'){
    const r=m.result; const nm=t=>ids.filter(s=>s[0]===t).map(s=>m.seats[s].name).join(' & ');
    body=`<div class="champ"><div class="big">${r==='D'?'🤝 Hoà':'🏆 '+esc(nm(r))}</div><p>${r==='D'?'Hai đội bất phân thắng bại':'chiến thắng!'} · Tỉ số ${m.score.A} – ${m.score.B}</p>
      <div class="row" style="justify-content:center">${Object.entries(m.delta||{}).map(([s,d])=>`<span class="chip">${seatLabel(m.seats[s])} ELO ${d>=0?'+':''}${d}</span>`).join('')}</div>
      <div class="row" style="justify-content:center;margin-top:12px">${opts.endButtons||''}</div></div>
      <details style="margin-top:12px"><summary class="small muted">Xem lại ${m.history.length} câu đã đấu</summary>${m.history.map((h,i)=>`<div class="mrow"><div><div class="small muted">Câu ${i+1} · ${chName(h.q.ch)}</div>${esc(h.q.q)}<div class="small" style="color:var(--ok)">✔ ${esc(h.q.opts[h.q.ans])}</div><div class="small muted">${esc(h.q.ex||'')}</div></div><span class="small">${h.winner?'+1 '+esc(m.seats[h.winner].name):'—'}</span></div>`).join('')}</details>`;
  } else if(q){
    const humans=ids.filter(s=>m.seats[s].kind==='human');
    const rev=m.phase==='rev';
    body=`${m.sudden?'<div class="tag l3" style="margin-bottom:6px">⚡ Câu hỏi phụ – ai đúng trước thắng</div>':''}<div class="timer"><i id="tbar" style="width:100%"></i></div>
     <div class="small muted">Câu ${m.qi+1} · ${chIc(q.ch)} ${chName(q.ch)} · ${lvTag(q)}</div><div class="qbox">${esc(q.q)}</div>
     <div class="opts">${q.opts.map((o,i)=>`<div class="opt ${rev&&i===q.ans?'ok':''}"><b class="k">${'ABCD'[i]}</b><span>${esc(o)}</span></div>`).join('')}</div>
     ${rev?`<div class="ex">${m.winner?`✅ ${seatLabel(m.seats[m.winner])} trả lời đúng trước, +1 cho đội ${m.winner[0]}`:'Không ai trả lời đúng.'} Đáp án <b>${'ABCD'[q.ans]}</b>. ${esc(q.ex||'')}</div>`:''}
     ${humans.length?`<div class="pads">${humans.map(s=>{ const ks=m.seats[s].keys; const lk=m.ans[s]||rev;
        return `<div class="pad ${s[0]} ${lk?'locked':''}"><div class="small"><b>${seatLabel(m.seats[s])}</b> <span class="muted">· phím ${ks.join(' ').toUpperCase()}</span></div><div class="pb">${[0,1,2,3].map(i=>`<button data-s="${s}" data-c="${i}" ${lk?'disabled':''}>${'ABCD'[i]} <span class="small muted">(${ks[i].toUpperCase()})</span></button>`).join('')}</div></div>`; }).join('')}</div>`:''}`;
  }
  el.innerHTML=`<div class="card"><div class="score"><div class="team A"><div class="small">ĐỘI A</div><div class="pts">${m.score.A}</div><div>${teamNames('A')}</div></div>
    <div class="vs">đến ${m.cfg.target}</div><div class="team B"><div class="small">ĐỘI B</div><div class="pts">${m.score.B}</div><div>${teamNames('B')}</div></div></div>${body}
    ${m.phase!=='end'?`<div class="row" style="justify-content:flex-end;margin-top:12px">${opts.extra||''}<button class="btn ghost sm" id="mquit">Dừng trận</button></div>`:''}</div>`;
  $$('[data-s]',el).forEach(b=>b.onclick=()=>m.answer(b.dataset.s,+b.dataset.c));
  const qb=$('#mquit',el); if(qb) qb.onclick=()=>confirmBox('Dừng trận đấu? Kết quả sẽ không được tính.',()=>{ m.stop(); opts.onQuit&&opts.onQuit(); });
}
function animTimer(m){ const raf=()=>{ const b=document.getElementById('tbar'); if(!b||m.phase==='end') return; const w=m.phase==='q'?Math.max(0,(m.deadline-Date.now())/m.limit*100):0; b.style.width=w+'%'; requestAnimationFrame(raf); }; requestAnimationFrame(raf); }
function matchKeys(m){ const h=e=>{ if(m.phase!=='q'||e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return; const k=e.key.toLowerCase();
    for(const s of m.seatIds()){ const st=m.seats[s]; if(st.kind!=='human') continue; const i=st.keys.indexOf(k); if(i>=0){ m.answer(s,i); return; } } };
  document.addEventListener('keydown',h); return ()=>document.removeEventListener('keydown',h); }

// ----- Trang Đấu trường (trên một máy)
const ARF={chs:[],lvs:[],mine:'all',mode:'1v1',target:5,seats:{}}; let AM=null;
function seatOptions(sel,allowEmpty){
  return `${DB.profiles.map(p=>`<option value="p:${p.id}" ${sel==='p:'+p.id?'selected':''}>${p.emo} ${esc(p.name)} (${p.elo})</option>`).join('')}
   ${[1,2,3,4,5,6,7,8].map(l=>`<option value="b:${l}" ${sel==='b:'+l?'selected':''}>🤖 ${BOT_NAMES[l-1]} – cấp ${l}</option>`).join('')}`;
}
function buildSeat(val,keyIdx){
  if(val.startsWith('b:')) return botSeat(+val.slice(2));
  const p=DB.profiles.find(x=>x.id===val.slice(2)); return {kind:'human',pid:p.id,name:p.name,emo:p.emo,elo:p.elo,keys:KEYSETS[keyIdx]};
}
function startLocalMatch(v,seatVals,cfg,onEnd){
  let ki=0; const seats={}; const used=new Set();
  for(const [s,val] of Object.entries(seatVals)){ if(!val) continue; if(val.startsWith('p:')){ if(used.has(val)){ toast('Một hồ sơ không thể ngồi hai ghế'); return false; } used.add(val); }
    seats[s]=buildSeat(val,ki); if(seats[s].kind==='human') ki++; }
  if(!Object.keys(seats).some(s=>s[0]==='A')||!Object.keys(seats).some(s=>s[0]==='B')){ toast('Cần người ngồi cả đội A và đội B'); return false; }
  let off=null;
  const m=new Match({seats,target:cfg.target,filter:cfg.filter,noDraw:cfg.noDraw,
    onUpdate:mm=>{ renderMatch(v,mm,{endButtons:cfg.endButtons||`<button class="btn pri" id="rem">Đấu lại</button><button class="btn ghost" id="back">Về sảnh</button>`,onQuit:()=>{ off&&off(); AM=null; cfg.onQuit?cfg.onQuit():viewArena(v);} });
      if(mm.phase!=='end') animTimer(mm);
      else { off&&off(); const r=$('#rem',v), b=$('#back',v); if(r) r.onclick=()=>startLocalMatch(v,seatVals,cfg,onEnd); if(b) b.onclick=()=>{AM=null;viewArena(v);}; } },
    onEnd:mm=>{ onEnd&&onEnd(mm); render0(); }});
  function render0(){ const p=$('#hdr .chip'); if(p&&curP()) p.textContent=`${curP().emo} ${curP().name} · ELO ${curP().elo}`; }
  AM=m; off=matchKeys(m); cleanup=()=>{ m.stop(); off&&off(); AM=null; };
  m.start(); return true;
}
function viewArena(v){
  if(AM&&AM.phase!=='end'){ AM.upd(); return; }
  const p=curP();
  if(!DB.profiles.length){ v.innerHTML=`<div class="card"><h2>⚔️ Đấu trường</h2><p>Tạo hồ sơ người chơi trước nhé.</p><button class="btn pri" id="mk">＋ Tạo hồ sơ</button></div>`; $('#mk').onclick=()=>profileDialog(()=>render()); return; }
  const S=ARF.seats; const two=ARF.mode==='2v2';
  if(!S.A1) S.A1='p:'+(p?p.id:DB.profiles[0].id); if(!S.B1) S.B1='b:3'; if(!S.A2) S.A2='b:2'; if(!S.B2) S.B2='b:2';
  const seatSel=(s)=>`<div><label class="f">${s[0]==='A'?'🔵':'🟠'} Ghế ${s}</label><select data-seat="${s}" style="width:100%">${seatOptions(S[s])}</select></div>`;
  v.innerHTML=`<div class="card"><h2>⚔️ Đấu trường</h2><p class="small muted" style="margin:0">Cùng một câu hỏi, <b>ai bấm đúng trước</b> ghi 1 điểm cho đội. Bấm sai thì bị khoá ở câu đó. Đội nào đủ điểm trước thì thắng. Nhiều bạn chơi chung một máy: mỗi bạn dùng một bộ phím riêng hoặc bấm nút trên màn hình.</p>

// ---------- CHỦ PHÒNG ----------
async function createRoom(){
  let code; for(let i=0;i<20;i++){ code='7'+String(Math.floor(Math.random()*10000)).padStart(4,'0'); const s=await roomRef(code).get(); if(!s.exists()) break; }
  await roomRef(code).set({app:'khtn7',host:FBUID,created:Date.now(),st:'lobby'});
  roomRef(code).onDisconnect().remove();
  ON={role:'host',code,offs:[],players:{},cfg:{mode:'1v1',target:5,chs:[],lvs:[],mine:'all',seats:{A1:'b:3',B1:'b:3',A2:'',B2:''}}};
  const ref=roomRef(code).child('players'); const h=ref.on('value',s=>{ ON.players=s.val()||{}; if(ON.lobbyRender) ON.lobbyRender(); });
  ON.offs.push(()=>ref.off('value',h));
}
function hostLobby(v){
  if(ON.match){ ON.match.upd(); return; } const C=ON.cfg; const two=C.mode==='2v2';
  const opts=sel=>`<option value="" ${!sel?'selected':''}>— Trống —</option>${Object.entries(ON.players).map(([u,p])=>`<option value="u:${u}" ${sel==='u:'+u?'selected':''}>🌐 ${esc(p.e)} ${esc(p.n)} (${p.elo})</option>`).join('')}
    ${DB.profiles.map(p=>`<option value="p:${p.id}" ${sel==='p:'+p.id?'selected':''}>💻 ${p.emo} ${esc(p.name)} (trên máy này)</option>`).join('')}
    ${[1,2,3,4,5,6,7,8].map(l=>`<option value="b:${l}" ${sel==='b:'+l?'selected':''}>🤖 ${BOT_NAMES[l-1]} – cấp ${l}</option>`).join('')}`;
  const seat=s=>`<div><label class="f">${s[0]==='A'?'🔵':'🟠'} Ghế ${s}</label><select data-seat="${s}" style="width:100%">${opts(C.seats[s])}</select></div>`;
  v.innerHTML=`<div class="card" style="text-align:center"><div class="muted">Mã phòng – đọc cho các bạn nhập</div><div class="code">${ON.code}</div>
   <div class="small muted">${Object.keys(ON.players).length} bạn đã vào phòng: ${Object.values(ON.players).map(p=>esc(p.e+' '+p.n)).join(', ')||'chưa có ai'}</div></div>
  <div class="card"><h3>🪑 Xếp ghế</h3><div class="row">${['1v1','2v2'].map(x=>`<span class="tog ${C.mode===x?'on':''}" data-mode="${x}">${x==='1v1'?'👤 1 vs 1':'👥 2 vs 2'}</span>`).join('')}<span style="flex:1"></span>
   <label class="small">Đấu đến <select id="htg">${[3,5,7,10,15].map(n=>`<option ${n===C.target?'selected':''}>${n}</option>`).join('')}</select> điểm</label></div>
   <div class="grid g2" style="margin-top:6px"><div>${seat('A1')}${two?seat('A2'):''}</div><div>${seat('B1')}${two?seat('B2'):''}</div></div>
   ${filterUI('hf',C)}
   <div class="row" style="justify-content:space-between;margin-top:14px"><button class="btn ghost" id="hclose">Đóng phòng</button><button class="btn pri" id="hstart">▶ Bắt đầu trận</button></div></div>`;
  ON.lobbyRender=()=>{ if(TAB==='online'&&ON.role==='host'&&!ON.match) hostLobby(v); };
  $$('[data-mode]',v).forEach(t=>t.onclick=()=>{ C.mode=t.dataset.mode; hostLobby(v); });
  $$('[data-seat]',v).forEach(s=>s.onchange=()=>{ C.seats[s.dataset.seat]=s.value; });
  $('#htg').onchange=e=>C.target=+e.target.value; bindFilter('hf',C);
  $('#hclose').onclick=()=>{ onlineLeave(); viewOnline(v); };
  $('#hstart').onclick=()=>hostStart(v);
}
async function hostStart(v){
  const C=ON.cfg; const ids=C.mode==='2v2'?['A1','A2','B1','B2']:['A1','B1']; const seats={}, pub={}; let ki=0; const used=new Set();
  for(const s of ids){ const val=C.seats[s]; if(!val) continue; if(used.has(val)&&!val.startsWith('b:')){ toast('Một người không thể ngồi hai ghế'); return; } used.add(val);
    if(val.startsWith('b:')) seats[s]=botSeat(+val.slice(2));
    else if(val.startsWith('p:')){ const p=DB.profiles.find(x=>x.id===val.slice(2)); seats[s]={kind:'human',pid:p.id,name:p.name,emo:p.emo,elo:p.elo,keys:KEYSETS[ki++]}; }
    else { const u=val.slice(2), p=ON.players[u]; if(!p){ toast('Có bạn đã rời phòng, xếp ghế lại nhé'); return; } seats[s]={kind:'remote',uid:u,name:p.n,emo:p.e,elo:p.elo||1000}; }
    pub[s]={n:seats[s].name,e:seats[s].emo,u:seats[s].uid||'',k:seats[s].kind}; }
  if(!ids.some(s=>s[0]==='A'&&seats[s])||!ids.some(s=>s[0]==='B'&&seats[s])){ toast('Cần người ngồi cả đội A và đội B'); return; }
  const R=roomRef(ON.code); await R.update({st:'play',seats:pub,target:C.target,g:null,a:null,res:null});
  let ansOff=null, curQi=-1;
  const m=new Match({seats,target:C.target,filter:{bank:C.bank,chs:C.chs,lvs:C.lvs,mine:C.mine,trs:C.trs,grs:C.grs},
    onUpdate:mm=>{
      renderMatch(v,mm,{extra:`<span class="chip">Phòng ${ON.code}</span>`,endButtons:`<button class="btn pri" id="hagain">Về sảnh, đấu tiếp</button>`,onQuit:()=>{ R.update({st:'lobby',g:null,a:null}); ON.match=null; hostLobby(v);} });
      if(mm.phase!=='end') animTimer(mm);
      const lock={}; Object.entries(mm.ans||{}).forEach(([s,a])=>lock[s]=a.ok?'ok':'x');
      const q=mm.q; const g={ph:mm.phase,qi:mm.qi,sc:mm.score,lock,sud:!!mm.sudden};
      if(q&&mm.phase!=='end'){ g.q={t:q.q,o:q.opts,lv:q.lv,ch:q.ch}; g.rem=Math.max(0,mm.deadline-Date.now()); g.lim=mm.limit; }
      if(mm.phase==='rev'){ g.ans=q.ans; g.ex=q.ex||''; g.win=mm.winner||''; }
      R.child('g').set(g);
      if(mm.phase==='q'&&mm.qi!==curQi){ curQi=mm.qi; if(ansOff) ansOff(); const ar=R.child('a/'+mm.qi);
        const h=ar.on('child_added',s=>{ const val=s.val()||{}; const st=mm.seats[s.key]; if(st&&st.kind==='remote'&&st.uid===val.u&&mm.qi===curQi) mm.answer(s.key,+val.c); });
        ansOff=()=>ar.off('child_added',h); }
      if(mm.phase==='end'){ const b=$('#hagain',v); if(b) b.onclick=()=>{ ON.match=null; R.update({st:'lobby',g:null,a:null}); hostLobby(v); }; }
    },
    onEnd:mm=>{ if(ansOff) ansOff(); const d={}; Object.entries(mm.delta||{}).forEach(([s,x])=>{ if(mm.seats[s].uid) d[mm.seats[s].uid]=x; });
      R.update({st:'end',res:{r:mm.result,sc:mm.score,d,id:Date.now()},a:null}); }});
  ON.match=m; const koff=matchKeys(m); ON.offs.push(koff); m.start();
}

// ---------- NGƯỜI CHƠI ----------
async function joinRoom(code,v){
  const s=await roomRef(code).get(); const r=s.val();
  if(!r||r.app!=='khtn7'){ toast('Không tìm thấy phòng '+code); return; }
  const p=curP(); await roomRef(code).child('players/'+FBUID).set({n:p.name,e:p.emo,elo:p.elo});
  roomRef(code).child('players/'+FBUID).onDisconnect().remove();
  ON={role:'guest',code,offs:[],room:r,pid:p.id,myAns:{}};
  const h=roomRef(code).on('value',ss=>{ ON.room=ss.val(); if(!ON.room){ toast('Phòng đã đóng'); onlineLeave(); if(TAB==='online') viewOnline(v); return; } if(TAB==='online') guestView(v); });
  ON.offs.push(()=>roomRef(code).off('value',h));
  guestView(v);
}
let GTIMER=null;
function guestView(v){
  const r=ON.room||{}; const p=DB.profiles.find(x=>x.id===ON.pid)||curP(); const seats=r.seats||{};
  const mySeat=Object.keys(seats).find(s=>seats[s].u===FBUID&&r.st!=='lobby');
  const head=`<div class="row between"><span class="chip">Phòng ${ON.code}</span><span class="chip">${p.emo} ${esc(p.name)}${mySeat?' · ghế '+mySeat:''}</span><button class="btn sm ghost" id="gl">Rời phòng</button></div>`;
  const g=r.g;
  // áp dụng ELO một lần khi trận kết thúc
  if(r.st==='end'&&r.res&&r.res.d&&r.res.d[FBUID]!==undefined){ const key=ON.code+':'+r.res.id; if(!DB.applied[key]){ DB.applied[key]=1; const d=r.res.d[FBUID]; p.elo=Math.max(100,p.elo+d);
    const myTeam=mySeat?mySeat[0]:null; if(myTeam){ if(r.res.r==='D')p.d++; else if(r.res.r===myTeam)p.w++; else p.l++; } save(); } }
  let body='';
  if(r.st==='lobby'||!g){ body=`<div style="text-align:center;padding:24px"><div class="big">⏳</div><p>Đã vào phòng. Chờ trọng tài xếp ghế và bắt đầu…</p><p class="small muted">${Object.values(r.players||{}).map(x=>esc(x.e+' '+x.n)).join(' · ')}</p></div>`; }
  else if(r.st==='end'&&r.res){ const res=r.res; const my=mySeat?mySeat[0]:null; const d=res.d&&res.d[FBUID];
    body=`<div class="champ"><div class="big">${res.r==='D'?'🤝 Hoà':my?(res.r===my?'🏆 Thắng rồi!':'💪 Thua sát nút!'):'Đội '+res.r+' thắng'}</div><p>Tỉ số ${res.sc.A} – ${res.sc.B}</p>${d!==undefined?`<span class="chip">ELO ${d>=0?'+':''}${d} → ${p.elo}</span>`:''}<p class="small muted">Chờ trọng tài mở trận tiếp…</p></div>`; }
  else if(g.q){ const q=g.q, rev=g.ph==='rev'; const mine=mySeat&&g.lock&&g.lock[mySeat]; const picked=ON.myAns[ON.code+':'+g.qi];
    const team=t=>Object.keys(seats).filter(s=>s[0]===t).map(s=>`<span class="seat ${g.lock&&g.lock[s]?(g.lock[s]==='ok'?'ok':'x'):''}">${esc(seats[s].e)} ${esc(seats[s].n)}</span>`).join('');
    body=`<div class="score"><div class="team A"><div class="pts">${g.sc.A}</div>${team('A')}</div><div class="vs">đến ${r.target}</div><div class="team B"><div class="pts">${g.sc.B}</div>${team('B')}</div></div>
     ${g.sud?'<div class="tag l3">⚡ Câu hỏi phụ</div>':''}<div class="timer"><i id="gbar" style="width:100%"></i></div>
     <div class="small muted">Câu ${g.qi+1} · ${chIc(q.ch)} ${chName(q.ch)} · <span class="tag ${q.lv>1?'l'+q.lv:''}">${(LEVELS[q.lv]||LEVELS[1]).tag}</span></div><div class="qbox">${esc(q.t)}</div>
     <div class="opts">${q.o.map((o,i)=>`<button class="opt ${rev&&i===g.ans?'ok':''} ${!rev&&picked===i?(mine==='x'?'bad':''):''} ${rev&&picked===i&&i!==g.ans?'bad':''}" data-c="${i}" ${(!mySeat||mine||rev||picked!==undefined)?'disabled':''}><b class="k">${'ABCD'[i]}</b><span>${esc(o)}</span></button>`).join('')}</div>
     ${rev?`<div class="ex">${g.win?`✅ ${esc(seats[g.win].e+' '+seats[g.win].n)} đúng trước!`:'Không ai đúng.'} Đáp án <b>${'ABCD'[g.ans]}</b>. ${esc(g.ex)}</div>`:''}
     ${!mySeat?'<p class="small muted">Bạn đang xem (không có ghế trong trận này).</p>':''}`;
    if(!rev&&g.rem){ const dl=Date.now()+g.rem, lim=g.lim||g.rem; clearInterval(GTIMER); GTIMER=setInterval(()=>{ const b=document.getElementById('gbar'); if(!b){clearInterval(GTIMER);return;} b.style.width=Math.max(0,(dl-Date.now())/lim*100)+'%'; },100); } }
  v.innerHTML=`<div class="card">${head}<div style="margin-top:12px">${body}</div></div><p class="small muted">Mẹo: bấm phím 1 2 3 4 để chọn nhanh.</p>`;
  $('#gl').onclick=()=>{ onlineLeave(); viewOnline(v); };
  const send=c=>{ if(!g||!g.q||g.ph!=='q'||!mySeat) return; const k=ON.code+':'+g.qi; if(ON.myAns[k]!==undefined) return; ON.myAns[k]=c;
    roomRef(ON.code).child(`a/${g.qi}/${mySeat}`).set({c,u:FBUID}); guestView(v); };
  $$('[data-c]',v).forEach(b=>b.onclick=()=>send(+b.dataset.c));
  if(!ON.keyBound){ ON.keyBound=true; const kh=e=>{ if(TAB!=='online'||ON.role!=='guest') return; if('1234'.includes(e.key)){ const gg=ON.room&&ON.room.g; if(gg) { const btn=$$('[data-c]')[+e.key-1]; if(btn&&!btn.disabled) btn.click(); } } };
    document.addEventListener('keydown',kh); ON.offs.push(()=>document.removeEventListener('keydown',kh)); }
}

// ===================== GIẢI ĐẤU NHIỀU NGÀY =====================
// Vòng bảng đấu vòng tròn (mỗi người tối đa 1 trận/ngày) → Bán kết chéo (Nhất A – Nhì B, Nhất B – Nhì A) → Chung kết + Tranh hạng 3.
// Thắng 3 điểm, hoà 1, thua 0. Xếp hạng: Điểm → Hiệu số → Đối đầu (bảng phụ giữa các bạn bằng điểm) → Tổng điểm ghi → Bốc thăm.
let TV={id:null,view:'sched'};
function curTour(){ return DB.tours.find(t=>t.id===TV.id)||null; }
function roundRobin(ids){ // phương pháp xoay vòng; trả về [[ [a,b], ...], ...] theo từng lượt
  const a=[...ids]; if(a.length%2) a.push(null); const n=a.length, rounds=[];
  for(let r=0;r<n-1;r++){ const pr=[]; for(let i=0;i<n/2;i++){ const x=a[i], y=a[n-1-i]; if(x!==null&&y!==null) pr.push(r%2?[y,x]:[x,y]); else pr.push([x??y,null]); }
    rounds.push(pr); a.splice(1,0,a.pop()); }
  return rounds;
}
function createTour(name,players,split,target,f,ex){
  const ps=players.map((p,i)=>Object.assign({i},p));
  let order=split==='elo'?[...ps].sort((a,b)=>(b.elo||1000)-(a.elo||1000)):shuffle(ps);
  const one=ps.length<6; const groups={A:[],B:[]};
  if(one) groups.A=order.map(p=>p.i);
  else order.forEach((p,k)=>{ const g=(Math.floor(k/2)%2===0)?(k%2?'B':'A'):(k%2?'A':'B'); groups[g].push(p.i); }); // chia rắn
  const matches=[]; let mid=0;
  for(const g of ['A','B']){ if(!groups[g].length) continue; roundRobin(groups[g]).forEach((rd,r)=>rd.forEach(([x,y])=>{ matches.push(y===null?{id:mid++,st:'G',g,day:r+1,p1:x,p2:null,bye:true}:{id:mid++,st:'G',g,day:r+1,p1:x,p2:y,s1:null,s2:null}); })); }
  const t=Object.assign({id:uid(),name:name||'Giải KHTN 7',created:Date.now(),players:ps,groups,one,target,filter:f,matches,seed:Math.random()},ex||{});
  DB.tours.push(t); save(); return t;
}
function standings(t,g){
  const ids=t.groups[g]; const rows={}; ids.forEach(i=>rows[i]={i,P:0,W:0,D:0,L:0,F:0,A:0,pts:0});
  const gm=t.matches.filter(m=>m.st==='G'&&m.g===g&&!m.bye&&m.s1!=null);
  gm.forEach(m=>{ const a=rows[m.p1], b=rows[m.p2]; a.P++; b.P++; a.F+=m.s1; a.A+=m.s2; b.F+=m.s2; b.A+=m.s1;
    if(m.s1>m.s2){a.W++;b.L++;a.pts+=3;} else if(m.s1<m.s2){b.W++;a.L++;b.pts+=3;} else {a.D++;b.D++;a.pts++;b.pts++;} });
  const lot=i=>{ const x=Math.sin((t.seed*1000+i)*9301)*10000; return x-Math.floor(x); };
  const h2h=(set)=>{ const mini={}; set.forEach(i=>mini[i]={pts:0,gd:0}); gm.forEach(m=>{ if(set.includes(m.p1)&&set.includes(m.p2)){ const d=m.s1-m.s2; mini[m.p1].gd+=d; mini[m.p2].gd-=d; if(d>0)mini[m.p1].pts+=3; else if(d<0)mini[m.p2].pts+=3; else {mini[m.p1].pts++;mini[m.p2].pts++;} } }); return mini; };
  let arr=Object.values(rows).sort((a,b)=>b.pts-a.pts||(b.F-b.A)-(a.F-a.A));
  // tách nhóm bằng điểm & hiệu số → xét đối đầu, điểm ghi, bốc thăm
  const out=[]; let k=0;
  while(k<arr.length){ let j=k; while(j<arr.length&&arr[j].pts===arr[k].pts&&(arr[j].F-arr[j].A)===(arr[k].F-arr[k].A)) j++;
    const grp=arr.slice(k,j); if(grp.length>1){ const mini=h2h(grp.map(r=>r.i)); grp.sort((a,b)=>mini[b.i].pts-mini[a.i].pts||mini[b.i].gd-mini[a.i].gd||b.F-a.F||lot(b.i)-lot(a.i)); grp.forEach(r=>r.tb=true); }
    out.push(...grp); k=j; }
  return out;
}
function pName(t,i){ const p=t.players[i]; return p?`${p.emo||'🙂'} ${esc(p.name)}`:'?'; }
function groupDone(t){ return t.matches.filter(m=>m.st==='G'&&!m.bye).every(m=>m.s1!=null); }
function advance(t){ // tạo vòng loại trực tiếp khi đủ điều kiện
  const lastDay=Math.max(...t.matches.map(m=>m.day));
  if(groupDone(t)&&!t.matches.some(m=>m.st!=='G')){
    if(t.one){ const s=standings(t,'A'); if(s.length<4){ t.matches.push({id:t.matches.length,st:'F',day:lastDay+1,p1:s[0].i,p2:s[1].i,s1:null,s2:null}); }
      else { t.matches.push({id:t.matches.length,st:'F',day:lastDay+1,p1:s[0].i,p2:s[1].i,s1:null,s2:null}); t.matches.push({id:t.matches.length,st:'3P',day:lastDay+1,p1:s[2].i,p2:s[3].i,s1:null,s2:null}); } }
    else { const A=standings(t,'A'), B=standings(t,'B'); t.matches.push({id:t.matches.length,st:'SF',sf:1,day:lastDay+1,p1:A[0].i,p2:B[1].i,s1:null,s2:null}); t.matches.push({id:t.matches.length,st:'SF',sf:2,day:lastDay+1,p1:B[0].i,p2:A[1].i,s1:null,s2:null}); }
    save(); return; }
  const sf=t.matches.filter(m=>m.st==='SF');
  if(sf.length===2&&sf.every(m=>m.s1!=null)&&!t.matches.some(m=>m.st==='F')){
    const w=m=>m.s1>m.s2?m.p1:m.p2, l=m=>m.s1>m.s2?m.p2:m.p1;
    t.matches.push({id:t.matches.length,st:'F',day:lastDay+1,p1:w(sf[0]),p2:w(sf[1]),s1:null,s2:null});
    t.matches.push({id:t.matches.length,st:'3P',day:lastDay+1,p1:l(sf[0]),p2:l(sf[1]),s1:null,s2:null}); save(); }
}
const STN={G:'Vòng bảng',SF:'Bán kết',F:'🏆 Chung kết','3P':'🥉 Tranh hạng 3'};

function viewTour(v){
  if(AM&&AM.phase!=='end'&&TV.playing){ AM.upd(); return; }
  const t=curTour();
  if(!t) return tourList(v);
  advance(t);
  const days=[...new Set(t.matches.map(m=>m.day))].sort((a,b)=>a-b);
  const R=syncAwards(t); const champ=R?awardsHTML(t,R):''; const F=0, P3=0;
  const champOld=F?`<div class="champ" style="margin-bottom:14px"><div class="big">🏆 ${pName(t,F.s1>F.s2?F.p1:F.p2)}</div><p>Vô địch ${esc(t.name)}</p><div class="row" style="justify-content:center"><span class="chip">🥈 ${pName(t,F.s1>F.s2?F.p2:F.p1)}</span>${P3?`<span class="chip">🥉 ${pName(t,P3.s1>P3.s2?P3.p1:P3.p2)}</span>`:''}</div></div>`:'';
  const table=g=>{ const s=standings(t,g); return `<div class="card"><h3>${t.one?'Bảng xếp hạng':'Bảng '+g}</h3><div style="overflow-x:auto"><table><tr><th>#</th><th class="l">Người chơi</th><th>Tr</th><th>T</th><th>H</th><th>B</th><th>Ghi</th><th>Mất</th><th>HS</th><th>Điểm</th></tr>
    ${s.map((r,k)=>`<tr class="${k<(t.one?2:2)?'q1':''}"><td>${k+1}</td><td class="l">${pName(t,r.i)}${r.tb?' <span class="small muted" title="Xếp theo đối đầu / điểm ghi / bốc thăm">*</span>':''}</td><td>${r.P}</td><td>${r.W}</td><td>${r.D}</td><td>${r.L}</td><td>${r.F}</td><td>${r.A}</td><td>${r.F-r.A>0?'+':''}${r.F-r.A}</td><td><b>${r.pts}</b></td></tr>`).join('')}</table></div>
    <p class="small muted" style="margin:6px 0 0">Tô xanh: vào vòng sau. * bằng điểm và hiệu số, xếp theo đối đầu → điểm ghi → bốc thăm.</p></div>`; };
  v.innerHTML=`<div class="card"><div class="row between"><div><h2 style="margin:0">🏆 ${esc(t.name)}</h2><div class="small muted">${t.players.length} người · ${t.one?'1 bảng':'2 bảng'} · mỗi trận đấu đến ${t.target} điểm · ${days.length} ngày thi đấu</div>${(t.prizes&&(t.prizes[1]||t.prizes[2]||t.prizes[3]))?`<div class="small" style="margin-top:4px">🎁 ${[1,2,3].filter(r=>t.prizes[r]).map(r=>PLACE[r].ic+' '+esc(t.prizes[r])).join(' · ')}</div>`:''}</div>
    <div class="row"><button class="btn sm ghost" id="tback">← Các giải</button><button class="btn sm" id="tcopy">📋 Sao chép bảng</button><button class="btn sm" id="texp">💾 Sao lưu</button></div></div>
    <div class="row" style="margin-top:10px">${[['sched','📅 Lịch theo ngày'],['table','📊 Bảng xếp hạng'],['rules','📜 Điều lệ']].map(([k,n])=>`<span class="tog ${TV.view===k?'on':''}" data-v="${k}">${n}</span>`).join('')}</div></div>
   ${champ}
   ${TV.view==='table'?(table('A')+(t.one?'':table('B'))):TV.view==='rules'?tourRules(t):
     days.map(d=>{ const ms=t.matches.filter(m=>m.day===d); const st=[...new Set(ms.map(m=>m.st))].map(x=>STN[x]).join(', ');
      return `<div class="daycard card"><div class="row between"><b>Ngày ${d}</b><span class="small muted">${st}</span></div>${ms.map(m=>{
        if(m.bye) return `<div class="mrow small muted"><span>${t.one?'':'Bảng '+m.g+' · '}${pName(t,m.p1)} nghỉ</span></div>`;
        const done=m.s1!=null; return `<div class="mrow"><span class="small muted" style="min-width:90px">${m.st==='G'?(t.one?'Vòng bảng':'Bảng '+m.g):STN[m.st]}</span><span style="flex:1;text-align:right">${pName(t,m.p1)}</span>
          <span class="res">${done?`${m.s1} – ${m.s2}`:'vs'}</span><span style="flex:1">${pName(t,m.p2)}</span>
          <span class="row">${done?`<button class="btn sm ghost" data-ed="${m.id}">✏️</button>`:`<button class="btn sm pri" data-play="${m.id}">▶ Đấu</button><button class="btn sm ghost" data-ed="${m.id}">✍ Nhập</button>`}</span></div>`; }).join('')}</div>`; }).join('')}`;
  $('#tback').onclick=()=>{ TV.id=null; viewTour(v); };
  $$('[data-v]',v).forEach(b=>b.onclick=()=>{ TV.view=b.dataset.v; viewTour(v); });
  $('#tcopy').onclick=()=>copyText(tourText(t),'Đã sao chép bảng xếp hạng, dán vào Zalo được ngay');
  $('#texp').onclick=()=>copyText(JSON.stringify({khtn7:'tour',v:1,tour:t}),'Đã sao chép dữ liệu giải. Dán vào Notepad để lưu.');
  $$('[data-ed]',v).forEach(b=>b.onclick=()=>editResult(t,t.matches.find(m=>m.id===+b.dataset.ed),v));
  $$('[data-play]',v).forEach(b=>b.onclick=()=>playTourMatch(t,t.matches.find(m=>m.id===+b.dataset.play),v));
  if(R) bindAwards(v,t,R);
}
function tourRules(t){ const pz=t.prizes||{}; return `<div class="card"><h3>Điều lệ</h3><ul>
  ${reqText(t)?`<li>Điều kiện tham gia: ${reqText(t)}.</li>`:''}
  ${(pz[1]||pz[2]||pz[3])?`<li>Giải thưởng: ${[1,2,3].filter(r=>pz[r]).map(r=>`${PLACE[r].ic} ${PLACE[r].s}: ${esc(pz[r])}`).join('; ')}.</li>`:''}
  <li>Danh hiệu phụ: ⚡ Vua tốc độ (trả lời đúng nhanh nhất, tính các trận đấu bằng ▶ Đấu), 🎯 Tay ghi điểm (ghi nhiều điểm nhất), 🛡️ Bất bại (không thua trận nào). Vô địch, á quân, hạng Ba và danh hiệu được giấy khen và huy chương lưu vào hồ sơ.</li>
  <li>${t.one?'Một bảng, mọi người đấu vòng tròn với nhau.':'Chia 2 bảng theo kiểu rắn (cân bằng trình độ). Trong bảng đấu vòng tròn.'} Mỗi người tối đa 1 trận mỗi ngày.</li>
  <li>Mỗi trận: cùng một câu hỏi, ai trả lời đúng trước được 1 điểm; ai đủ <b>${t.target} điểm</b> trước thì thắng. Nếu hết ${t.target*2+6} câu mà chưa ai đủ điểm, vòng bảng tính <b>hoà</b>; vòng loại trực tiếp đấu tiếp <b>câu hỏi phụ</b> đến khi có người dẫn trước.</li>
  <li>Tính điểm: thắng 3, hoà 1, thua 0.</li>
  <li>Xếp hạng: Điểm → Hiệu số (điểm ghi − điểm mất) → Đối đầu giữa các bạn bằng điểm → Tổng điểm ghi → Bốc thăm.</li>
  <li>${t.one?(t.players.length>=4?'Hạng 1 gặp hạng 2 ở Chung kết; hạng 3 gặp hạng 4 tranh hạng Ba.':'Hạng 1 gặp hạng 2 ở Chung kết.'):'Bán kết chéo: Nhất A – Nhì B, Nhất B – Nhì A. Thắng vào Chung kết, thua tranh hạng Ba.'}</li>
  <li>Trận đấu trên máy khác (online hay trên giấy) thì trọng tài bấm <b>✍ Nhập</b> để ghi tỉ số.</li></ul></div>`; }
function tourText(t){ let s=`🏆 ${t.name}\n`; for(const g of (t.one?['A']:['A','B'])){ s+=`\n${t.one?'BẢNG XẾP HẠNG':'BẢNG '+g}\n`; standings(t,g).forEach((r,k)=>{ const p=t.players[r.i]; s+=`${k+1}. ${p.emo||''} ${p.name} – ${r.pts}đ (T${r.W} H${r.D} B${r.L}, HS ${r.F-r.A>=0?'+':''}${r.F-r.A})\n`; }); }
  const R=tourResults(t); if(R&&R.titles.length) s+='\nDanh hiệu: '+R.titles.map(x=>`${TITLES[x.k].ic} ${TITLES[x.k].n}: ${t.players[x.i].name}`).join('; ')+'\n';
  t.matches.filter(m=>m.st!=='G').forEach(m=>{ s+=`\n${STN[m.st].replace(/^(🏆|🥉) /u,'')}: ${t.players[m.p1].name} ${m.s1!=null?m.s1+' – '+m.s2:'vs'} ${t.players[m.p2].name}`; }); return s; }
function editResult(t,m,v){
  const ko=m.st!=='G';
  const md=modal(`<h3>Nhập kết quả</h3><p class="small muted">${STN[m.st]} · Ngày ${m.day}${ko?' · vòng loại trực tiếp không được hoà':''}</p>
   <div class="grid g2"><div><label class="f">${pName(t,m.p1)}</label><input type="number" id="r1" min="0" value="${m.s1??''}"></div><div><label class="f">${pName(t,m.p2)}</label><input type="number" id="r2" min="0" value="${m.s2??''}"></div></div>
   <div class="row" style="justify-content:space-between;margin-top:14px">${m.s1!=null?'<button class="btn ghost" data-clr>Xoá kết quả</button>':'<span></span>'}<div class="row"><button class="btn ghost" data-x>Huỷ</button><button class="btn pri" data-y>Lưu</button></div></div>`);
  $('[data-x]',md).onclick=()=>md.remove();
  const clr=$('[data-clr]',md); if(clr) clr.onclick=()=>{ if(laterKO(t,m)){ toast('Đã có vòng sau, không xoá được'); return; } m.s1=m.s2=null; save(); md.remove(); viewTour(v); };
  $('[data-y]',md).onclick=()=>{ const a=parseInt($('#r1',md).value), b=parseInt($('#r2',md).value); if(isNaN(a)||isNaN(b)||a<0||b<0){ toast('Nhập tỉ số hợp lệ'); return; } if(ko&&a===b){ toast('Vòng loại trực tiếp phải có người thắng'); return; }
    if(m.s1!=null&&laterKO(t,m)&&((m.s1>m.s2)!==(a>b))){ toast('Đổi người thắng sẽ làm sai vòng sau. Xoá vòng sau trước.'); return; }
    m.s1=a; m.s2=b; save(); md.remove(); viewTour(v); };
}
function laterKO(t,m){ const order={G:0,SF:1,F:2,'3P':2}; return t.matches.some(x=>order[x.st]>order[m.st]); }
function playTourMatch(t,m,v){
  const prof=i=>{ const p=t.players[i]; let pr=p.pid&&DB.profiles.find(x=>x.id===p.pid); if(!pr){ pr=DB.profiles.find(x=>x.name===p.name); }
    if(!pr){ pr=newProfile(p.name,p.emo); } p.pid=pr.id; p.emo=pr.emo; return 'p:'+pr.id; };
  const vals={A1:prof(m.p1),B1:prof(m.p2)}; save(); TV.playing=true;
  const ok=startLocalMatch(v,vals,{target:t.target,filter:t.filter,noDraw:m.st!=='G',endButtons:`<button class="btn pri" id="tret">Lưu & về lịch thi đấu</button>`,onQuit:()=>{TV.playing=false;viewTour(v);}},
    mm=>{ m.s1=mm.score.A; m.s2=mm.score.B; const sp={1:[0,0],2:[0,0]}; mm.history.forEach(h=>{ [['A1',1],['B1',2]].forEach(([s,k])=>{ const a=h.ans[s]; if(a&&a.ok&&h.t0){ sp[k][0]+=a.t-h.t0; sp[k][1]++; } }); }); m.sp=sp; save(); setTimeout(()=>{ const b=$('#tret',v); if(b) b.onclick=()=>{ TV.playing=false; AM=null; viewTour(v); }; },0); });
  if(!ok) TV.playing=false;
}

  ${hallHTML()}
  <div class="card"><h3>＋ Tạo giải mới</h3>
   <label class="f">Tên giải</label><input type="text" id="tn" placeholder="Ví dụ: Giải KHTN 7A – Học kì I" maxlength="50">
   <label class="f">Người chơi – chọn hồ sơ trên máy này</label><div class="row" id="tpf">${DB.profiles.filter(p=>!p.role||p.role==='hs').map(p=>`<span class="tog" data-pid="${p.id}">${p.emo} ${esc(p.name)} <span class="small muted" data-elig="${p.id}"></span></span>`).join('')||'<span class="small muted">Chưa có hồ sơ</span>'}</div>
   <label class="f">…và/hoặc gõ thêm tên (mỗi dòng một bạn)</label><textarea id="tnames" placeholder="Na\nBin\nTôm"></textarea>
   <div class="row" style="margin-top:8px"><label class="small">Chia bảng <select id="tsp"><option value="elo">Theo ELO (cân bằng)</option><option value="rand">Ngẫu nhiên</option></select></label>
    <label class="small">Mỗi trận đến <select id="ttg">${[3,5,7,10].map(n=>`<option ${n===5?'selected':''}>${n}</option>`).join('')}</select> điểm</label></div>
   ${filterUI('tf',NT.f)}
   <div class="card" style="margin:12px 0 0;background:var(--bg2,#f6faf7)"><h3 style="margin-top:0">🎟 Điều kiện tham gia</h3>

const PLACE={1:{ic:'🥇',n:'Vô địch',s:'Giải Nhất'},2:{ic:'🥈',n:'Á quân',s:'Giải Nhì'},3:{ic:'🥉',n:'Hạng Ba',s:'Giải Ba'}};

// ---- điều kiện tham gia: ELO tối thiểu + số câu đúng khi luyện tập các chương của giải
function reqChs(t){ const c=(t.filter&&t.filter.chs)||[]; return c.length?c:null; }
function pracOk(p,chs){ let s=0; for(const [k,v] of Object.entries(p.pp||{})) if(!chs||chs.includes(k)) s+=v.ok||0; return s; }
function eligible(p,req,chs){ req=req||{}; const why=[];
  if(!(req.elo||req.ok)) return {ok:true,why};
  if(!p) return {ok:false,why:['chưa có hồ sơ trên máy này']};
  if(req.elo&&p.elo<req.elo) why.push(`ELO ${p.elo}/${req.elo}`);
  if(req.ok){ const n=pracOk(p,chs); if(n<req.ok) why.push(`luyện đúng ${n}/${req.ok} câu`); }
  return {ok:!why.length,why}; }
function reqText(t){ const r=t.req||{}; if(!(r.elo||r.ok)) return ''; const chs=reqChs(t);
  return [r.elo?`ELO từ <b>${r.elo}</b> trở lên`:'', r.ok?`đã làm đúng ít nhất <b>${r.ok} câu</b> khi luyện tập ${chs?'các chương '+chs.map(chName).join(', '):'(mọi chương)'}`:''].filter(Boolean).join(' và '); }

// ---- tính kết quả: hạng 1-2-3 và danh hiệu phụ
function tourResults(t){
  const F=t.matches.find(m=>m.st==='F'&&m.s1!=null); if(!F) return null;
  const P3=t.matches.find(m=>m.st==='3P'&&m.s1!=null);
  const w=m=>m.s1>m.s2?m.p1:m.p2, l=m=>m.s1>m.s2?m.p2:m.p1;
  const places=[{r:1,i:w(F)},{r:2,i:l(F)}]; if(P3) places.push({r:3,i:w(P3)});
  const st={}; t.players.forEach((p,i)=>st[i]={F:0,P:0,L:0,ts:0,tn:0});
  t.matches.filter(m=>!m.bye&&m.s1!=null).forEach(m=>{ const a=st[m.p1], b=st[m.p2]; a.P++; b.P++; a.F+=m.s1; b.F+=m.s2; if(m.s1<m.s2) a.L++; else if(m.s2<m.s1) b.L++;
    if(m.sp){ if(m.sp[1]){a.ts+=m.sp[1][0];a.tn+=m.sp[1][1];} if(m.sp[2]){b.ts+=m.sp[2][0];b.tn+=m.sp[2][1];} } });
  const titles=[]; const ids=Object.keys(st).map(Number);
  const mx=Math.max(...ids.map(i=>st[i].F)); if(mx>0) ids.filter(i=>st[i].F===mx).forEach(i=>titles.push({k:'score',i,v:mx+' điểm'}));
  ids.filter(i=>st[i].P>=2&&st[i].L===0).forEach(i=>titles.push({k:'unbeaten',i,v:st[i].P+' trận'}));
  const sp=ids.filter(i=>st[i].tn>=3).map(i=>({i,a:st[i].ts/st[i].tn})).sort((x,y)=>x.a-y.a);
  if(sp.length) titles.push({k:'speed',i:sp[0].i,v:(sp[0].a/1000).toFixed(1).replace('.',',')+' giây/câu'});
  return {places,titles,date:F.at||Date.now()};
}
function tourProf(t,i){ const p=t.players[i]; if(!p) return null; return (p.pid&&DB.profiles.find(x=>x.id===p.pid))||DB.profiles.find(x=>x.name.toLowerCase()===String(p.name).toLowerCase())||null; }
// ghi huy chương vào hồ sơ + bảng vàng (chạy lại được, sửa kết quả thì tự cập nhật)
function syncAwards(t){
  const R=tourResults(t); const before=JSON.stringify([DB.hall,DB.profiles.map(p=>p.medals||[])]);
  DB.profiles.forEach(p=>{ if(p.medals) p.medals=p.medals.filter(m=>m.tid!==t.id); });
  DB.hall=DB.hall.filter(h=>h.tid!==t.id);
  if(R){ const d=Date.now();
    const give=(i,o)=>{ const p=tourProf(t,i); if(p){ p.medals=p.medals||[]; p.medals.push(Object.assign({tid:t.id,tn:t.name,d},o)); } };
    R.places.forEach(x=>give(x.i,{r:x.r})); R.titles.forEach(x=>give(x.i,{k:x.k}));
    const nm=i=>{ const p=t.players[i]; return {n:p.name,e:p.emo||'🙂'}; };
    DB.hall.push({tid:t.id,tn:t.name,d:t.created,places:R.places.map(x=>Object.assign({r:x.r},nm(x.i))),titles:R.titles.map(x=>Object.assign({k:x.k,v:x.v},nm(x.i)))}); }
  if(JSON.stringify([DB.hall,DB.profiles.map(p=>p.medals||[])])!==before) save();
  return R;
}
